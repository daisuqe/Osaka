  #titleManual:hover{text-decoration:underline;filter:none}

  #stageList::-webkit-scrollbar{display:none} #stageList.drag{cursor:grabbing} #stageList>:first-child{margin-left:auto} #stageList>:last-child{margin-right:auto}   /* 少ないときは中央、はみ出すときは左端から横スクロール */

    filter:drop-shadow(0 4px 0 rgba(150,70,0,.9)) drop-shadow(0 0 18px rgba(255,210,80,.9));animation:fxPop var(--ms,3200ms) cubic-bezier(.2,.9,.3,1) forwards}
  #fxBanner .sub{font-size:clamp(22px,6vw,44px);font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(0,40,90,.85),0 0 14px rgba(120,200,255,.9);animation:fxPop2 var(--ms,3200ms) ease-out forwards}
  @keyframes fxPop{0%{transform:scale(.15) rotate(-6deg);opacity:0}10%{transform:scale(1.3) rotate(2deg);opacity:1}20%{transform:scale(1) rotate(0)}86%{opacity:1}100%{transform:scale(1.06);opacity:0}}
  @keyframes fxPop2{0%,14%{transform:translateY(14px);opacity:0}28%{transform:translateY(0);opacity:1}86%{opacity:1}100%{opacity:0}}
  .fxRays{position:absolute;left:50%;top:26%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;
    background:repeating-conic-gradient(from 0deg,rgba(255,235,140,.34) 0 7deg,rgba(255,235,140,0) 7deg 14deg);
    -webkit-mask-image:radial-gradient(circle,#000 0,transparent 22%);mask-image:radial-gradient(circle,#000 0,transparent 22%);
    animation:fxSpin var(--ms,3200ms) linear forwards}
  @keyframes fxSpin{0%{transform:rotate(0);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:rotate(70deg);opacity:0}}
  .fxConf{position:absolute;top:-6vh;width:10px;height:16px;opacity:0;animation:fxFall var(--d,2.6s) linear var(--w,0s) forwards}
  @keyframes fxFall{0%{transform:translate3d(0,0,0) rotate(0);opacity:1}100%{transform:translate3d(var(--dx,0),112vh,0) rotate(var(--r,720deg));opacity:1}}
  #hintOk{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(44px,calc(env(safe-area-inset-bottom) + 34px));display:none;z-index:4;padding:12px 32px;font-size:30px;min-height:56px;box-shadow:0 3px 10px rgba(0,0,0,.45)}
  #panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);z-index:5}
  #panelBox{background:#1d2c35;border-radius:10px;padding:14px 18px;max-width:92vw;max-height:88vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  #panelBox h3{margin:0 0 10px;font-size:32px}
  #panelBox table{border-collapse:collapse;margin:10px 0;font-size:18px;width:100%}
  #panelBox th,#panelBox td{padding:3px 10px;text-align:right;border-bottom:1px solid rgba(255,255,255,.1)}

  #panelBox button{margin-top:6px;width:100%}
  #clearToast{position:fixed;left:50%;top:19%;transform:translateX(-50%);display:none;z-index:35;pointer-events:none;white-space:nowrap;text-align:center}
  #clearToast span{display:block;background:linear-gradient(180deg,#fffbd0 0%,#ffd84d 55%,#ff9a1f 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
    filter:drop-shadow(1.5px 0 0 rgba(110,52,0,.88)) drop-shadow(-1.5px 0 0 rgba(110,52,0,.88)) drop-shadow(0 1.5px 0 rgba(110,52,0,.88)) drop-shadow(0 -1.5px 0 rgba(110,52,0,.88)) drop-shadow(0 0 11px rgba(255,208,95,.8)) drop-shadow(0 0 18px rgba(255,190,60,.4))}   /* 背景はなし。茶色の縁取り(少し濃いめ)と、金色の光(2重・ほどよい強さ) */
  #clearToast .tb{font-size:clamp(40px,11vw,76px);font-weight:900;letter-spacing:.05em;line-height:1.1}   /* 1行目: 作った建物の祝福(主役) */

  #clearToast.show{animation:toastIn 2.4s ease-out forwards} #clearToast.show.long{animation:toastInLong 4.6s ease-out forwards}   /* 64以上を作ったときの祝福。レベルアップのバナーより、ずっと控えめ */
  @keyframes toastInLong{0%{opacity:0;transform:translateX(-50%) translateY(6px) scale(.9)}9%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.04)}13%{transform:translateX(-50%) scale(1)}84%{opacity:1}100%{opacity:0}}
  @keyframes toastIn{0%{opacity:0;transform:translateX(-50%) translateY(6px) scale(.9)}16%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.04)}24%{transform:translateX(-50%) scale(1)}78%{opacity:1}100%{opacity:0}}
  #mapTitle{position:fixed;left:14px;font-size:40px;font-weight:700;letter-spacing:.03em;pointer-events:none;

  /* スマホ横持ち: 上部バーを1列に収め、グレー背景をなくして文字の影で読ませる。押しやすいよう、文字とボタンを大きくし、上に隙間を作る */

    #hud{flex-wrap:nowrap;gap:0 14px;font-size:17px;padding:max(12px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));
      background:none;backdrop-filter:none;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.75),0 0 2px rgba(0,0,0,.6)}
    #hud b{font-size:23px;margin-left:4px}
    #scoreBox b,#levelBox b{font-size:32px;margin-left:4px}

    #hud.tight{gap:0 8px} #hud.tight .btns{gap:4px}            /* 項目どうしの間も、少し詰める */

    #hud.tight #scoreBox b{font-size:26px}
    #hud.tighter{font-size:15px} #hud.tighter b{font-size:20px} #hud.tighter #scoreBox b{font-size:22px} #hud.tighter button{font-size:16px;padding:6px 5px}   /* それでも収まらない小さな画面(幅が狭いスマホ)や、桁が多いスコアのとき */
  }
  /* スマホ横向きのスタート画面: マップを小さくして縦に重ならないようにし、Ranking / How to Play も画面内に収める */
  @media (orientation:landscape) and (max-height:500px){

// 大阪の4ステージ(namba / tempozan / osakastation / tsutenkaku)は、はじめから全部選べる。
//   解放条件を付けるときは、下の UNLOCK_OSAKA の行を、UNLOCK の中へ移す(仮の条件を、入れてある)
const UNLOCK_OSAKA = {
  tempozan:  {best:50000, text:'Reach 50,000 points in one game'},
  osakastation: {total:80000, text:'Earn 80,000 points in total'},
  tsutenkaku: {total:120000, text:'Earn 120,000 points in total'},
};
const UNLOCK = {
  minato:    {best:50000, text:'Reach 50,000 points in one game'},
  chinatown: {total:150000, text:'Earn 150,000 points in total'},
};
const PROG_KEY = 'osaka-progress';
let PROG = {total:0, best:0, unlocked:{}};
try{ const d=JSON.parse(localStorage.getItem(PROG_KEY)||'null'); if(d) PROG={total:+d.total||0, best:+d.best||0, unlocked:d.unlocked||{}}; }catch(_){}
const PREVIEW = new URLSearchParams(location.search).has('preview');   // タイトル画面のカード用: 保存せず、建物でいっぱいの盤面を1枚映す
const DEV = new URLSearchParams(location.search).has('dev') || PREVIEW;     // ?dev=1 で全ステージを開放(確認用)

function checkUnlocks(){                             // 条件を満たしたステージを開放して、新しく開放したものを返す

  for(const [id,u] of Object.entries(UNLOCK)){
    if(PROG.unlocked[id]) continue;
    if((u.best && PROG.best>=u.best) || (u.total && PROG.total>=u.total)){ PROG.unlocked[id]=true; out.push(id); }

}

const LAND=0, ROAD=1, WATER=2, BRIDGE=3, RAIL=4, STATION=5, GSTN=6, MTOWER=7, LMARK=8, HWY=9, HWYW=10, SHOP=11, SBRIDGE=12, ARC=13, VIA=14, VSTN=15, HKST=16;   // VIA: 高架の線路 / VSTN: 高架の駅(大阪駅) / HKST: 阪急の駅(大阪梅田)   // GSTN: ゴンドラの乗り場(道なし。建物は建たず、駒も通れない)
const CH = {'.':LAND,'r':ROAD,'W':WATER,'R':RAIL,'S':STATION,'T':GSTN,'M':MTOWER,'K':LMARK,'F':LMARK,'Z':LMARK,'H':HWY,'U':ROAD,'L':LMARK,'E':LMARK,'s':SHOP,'a':ARC,'V':VIA,'O':VSTN,'N':HKST,'x':ROAD,'o':ROAD,'Y':LMARK,'Q':LMARK,'J':LMARK};   // M: マリンタワー(建物は建たず、駒も通れない)
//   K/F/Z: ランドマーク(建物は建たず、駒も通れない) / H: 高速(高架。下は海。駒も車も通れない) / U: 高架の下を通る道
const terrain = MAPDEF.rows.map(row => [...row].map(c => CH[c]));
const LMK = {}, DECK = new Set(), VDK = new Set(), VSX = new Set();      // VSX: 道の上に立つ高架の駅のマス      // VDK: 高架の線路が通るマス                            // LMK: ランドマークの種類(座標→文字)。DECK: 高架が通るマス
MAPDEF.rows.forEach((row,y)=>[...row].forEach((c,x)=>{ if('KFZLEYQJ'.includes(c)) LMK[y*N0+x]=c; if(c==='V'||c==='O'||c==='x'||c==='o') VDK.add(y*N0+x); if(c==='o') VSX.add(y*N0+x); if(c==='H'||c==='U') DECK.add(y*N0+x); }));
for(let y=0;y<N0;y++) for(let x=0;x<N0;x++) if(terrain[y][x]===HWY) terrain[y][x]=HWYW;     // 高架の下は、道以外は海(水面を描く)
// 運河を左右または上下に挟んでいる道 = 橋(商店街なら、歩行者の橋)。盤面の端で、片側が水なら、川は盤面の外へ続くので、そこも橋
for(let y=0;y<N;y++) for(let x=0;x<N;x++){

  const w=(a,b)=>a>=0&&b>=0&&a<N&&b<N&&(terrain[b][a]===WATER||terrain[b][a]===HWYW);   // 高架の下の海も水
  const oob=(a,b)=>a<0||b<0||a>=N||b>=N;
  const span=(a,b,c,d)=>(w(a,b)&&w(c,d))||(oob(a,b)&&w(c,d))||(w(a,b)&&oob(c,d));     // 盤面の端で、片側が水・反対側が盤面の外のときも、橋(川が盤面の外へ続いている)
  if(span(x-1,y,x+1,y)||span(x,y-1,x,y+1)) terrain[y][x]=terrain[y][x]===SHOP?SBRIDGE:BRIDGE;
}

function randInit(){ return Math.random() < LV_PROB[0]/(LV_PROB[0]+LV_PROB[1]) ? 1 : 2; }
const P8 = {64:.15, 128:.25, 256:.38, 512:.5};     // 今までで一番大きい数字 → 新築で数字8が出る確率(512以上は5割)
function randVal(){                    // 新築の数字。進み具合(今までで一番大きい数字 bestValue)が大きいほど、数字8が出やすくなる
  const r=Math.random();
  if(bestValue>=1024) return r<.05 ? 1 : r<.25 ? 2 : r<.50 ? 4 : 8;     // 1024を作ったあと: 1は5%、2は20%、4は25%、8は50%
  if(bestValue>=64){
    const p8=P8[Math.min(bestValue,512)]||.5, rest=(1-p8)/.85;      // 残りは、1:2:4 = 30:30:25 の割合で分ける
    return r<p8 ? 8 : (r-p8)<.30*rest ? 1 : (r-p8)<.60*rest ? 2 : 4;
  }
  const p8=.03, rest=1-p8;               // 64未満: 8も、少しだけ(3%)出る。残りは、1:2:4 = 45:35:20
  return r<p8 ? 8 : (r-p8)<LV_PROB[0]*rest ? 1 : (r-p8)<(LV_PROB[0]+LV_PROB[1])*rest ? 2 : 4;
}

const tintCache = new Map();
const USE_TINT = false;                // 種類ごとの色(青・赤・緑)を建物の画像に重ねるか。今はオフ(true で復活)
function tinted(im,k){                 // 画像に種類の色を重ねたものを作る
  if(!USE_TINT) return im;
  const key=im.src+'|'+k; let c=tintCache.get(key);
  if(c) return c;
  const kd=KINDS[k], W=im.naturalWidth, H=im.naturalHeight;
  c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');
  g.drawImage(im,0,0);
  if(kd.gamma){
    // 明るさ補正: 画像を自身に「スクリーン」合成 = 中間調を持ち上げるガンマ補正に近い(白飛びしにくい)
    g.globalCompositeOperation='screen'; g.globalAlpha=kd.gamma; g.drawImage(im,0,0);
    // 色の重ね: 「カラー」合成 = 明るさを保ったまま色相・彩度だけ青へ寄せる(暗くならない)
    const t=document.createElement('canvas'); t.width=W; t.height=H;
    const tg=t.getContext('2d');
    tg.drawImage(c,0,0);
    tg.globalCompositeOperation='color'; tg.globalAlpha=kd.tintA; tg.fillStyle=kd.tint; tg.fillRect(0,0,W,H);
    tg.globalCompositeOperation='destination-in'; tg.globalAlpha=1; tg.drawImage(im,0,0);   // 元の絵の形で切り抜く
    g.globalCompositeOperation='source-over'; g.globalAlpha=1; g.clearRect(0,0,W,H); g.drawImage(t,0,0);
  } else {
    g.globalCompositeOperation='source-atop';
    g.globalAlpha=kd.tintA; g.fillStyle=kd.tint; g.fillRect(0,0,W,H);
  }
  tintCache.set(key,c); return c;
}

function newGame(){
  grid = Array.from({length:N}, () => Array(N).fill(0));
  kind = Array.from({length:N}, () => Array(N).fill(0));
  const cells = [];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(terrain[y][x]===LAND) cells.push([x,y]);
  const mid=(N-1)/2;                      // 中心からの距離(+ゆらぎ)で並べ、近い順に配置
  for(const c of cells) c.d=Math.hypot(c[0]-mid,c[1]-mid)+Math.random()*3;
  cells.sort((a,b)=>a.d-b.d);
  const n = Math.round(cells.length*INIT_RATE);
  const kinds=Array.from({length:n},(_,i)=>i%KINDS.length); shuffle(kinds);   // 最初の種類の比率は均等(1個以内の差)
  for(let i=0;i<n;i++){ const [x,y]=cells[i]; grid[y][x]=randInit(); kind[y][x]=kinds[i]; anims.set(y*N+x,{t:performance.now()+i*4,type:'spawn'}); }
  sites.clear(); fresh.clear(); undoStack.length=0; score=0; turns=0; bestValue=1; stats=newStats(); sel=null; targets=new Map(); preview=null; hintMode=false; hintPairs=null; mover=null; effects=[]; hover=null; over=false; boardFull=false; stuck=false;
  bestValue = Math.max(1, ...grid.flat());   // 最初の盤面の最大の数字(1か2)
  gameId = Date.now(); bestKind = 1;
  for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(grid[y][x]===bestValue){ bestKind=kind[y][x]; }
  setMsg('');
  hud(); checkGameOver();
}
function previewInit(){
  document.body.classList.add('preview'); showInfo=false;
  grid = Array.from({length:N}, () => Array(N).fill(0));
  kind = Array.from({length:N}, () => Array(N).fill(0));
  // 更地すべてに建物を置く。駅(なければ盤面の中央)に近いほどレベルの高い建物、遠いほど低い建物にする。
  //   種類はマップごとの割合 / 駅前にテント(レベル1の住宅)は置かない / 最高ランク(レベル8=数字128)は駅前に1つだけ
  const hubs=[]; for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(terrain[y][x]===STATION||terrain[y][x]===GSTN) hubs.push([x,y]);
  if(!hubs.length) hubs.push([(N-1)/2,(N-1)/2]);
  const cells=[]; for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(terrain[y][x]===LAND){
    const d=Math.min(...hubs.map(h=>Math.hypot(h[0]-x,h[1]-y)));
    cells.push({x,y,d:d+Math.random()*1.4});               // 距離に少しゆらぎを足して、段々にならないようにする
  }
  cells.sort((a,b)=>a.d-b.d);                              // 駅に近い順
  const n=cells.length, mix=MAPDEF.previewMix||[1/3,1/3,1/3];
  const kinds=cells.map((_,i)=>{ const r=(i+.5)/n; return r<mix[0]?0:r<mix[0]+mix[1]?1:2; }); shuffle(kinds);   // 種類は割合どおり、場所はばらばら
  const caps={7:1,6:2}, used={7:0,6:0};                     // お店のレベル7は1軒、レベル6は2軒まで
  cells.forEach((c,i)=>{
    const t=n>1?i/(n-1):0;                                  // 0=駅前 〜 1=いちばん遠い
    let lv=7-Math.round(t*6)+((Math.random()*3|0)-1);       // 近いほど高く、遠いほど低く(±1のゆらぎ)
    lv=Math.max(1,Math.min(7,lv));
    const k=kinds[i];
    if(k===0 && t<.5) lv=Math.max(3,lv);                    // 駅前・ビブレの近くにテント(レベル1)・小屋(レベル2)の住宅は置かない
    if(k===1 && (lv===7||lv===6)){ if(used[lv]>=caps[lv]) lv=5; else used[lv]++; }
    grid[c.y][c.x]=Math.pow(2,lv-1); kind[c.y][c.x]=k;
  });
  grid[cells[0].y][cells[0].x]=128;                          // 最高ランクは駅前の1つだけ
  sites.clear(); fresh.clear(); undoStack.length=0; stats=newStats(); score=0; turns=0; bestValue=1;
  sel=null; targets=new Map(); preview=null; hintMode=false; hintPairs=null; mover=null; effects=[]; hover=null; over=false; boardFull=false; stuck=false;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } }
function setMsg(s,big,sub){                           // big=true: 少し大きめに(つながらない理由など) / sub: その下に、小さい文字で、もう1行

  if(sub){ const d=document.createElement('div'); d.className='sub'; d.textContent=sub; m.appendChild(d); }

anims = new Map();

// ================= ルール =================
const inb = (x,y) => x>=0 && y>=0 && x<N && y<N;
// 駒が通れるのは 白・道・橋 のみ(運河・線路・駅は不可)
const walkable = t => t===LAND||t===ROAD||t===BRIDGE;
const free = (x,y) => inb(x,y) && grid[y][x]===0 && walkable(terrain[y][x]) && !sites.has(y*N+x);

// (ax,ay)の駒が「0回か1回曲がって」止まれるセル -> そこまでの経路(自分の位置も含む)
function reachFrom(ax, ay){
  const reach = new Map();
  const add = p => { const [x,y]=p[p.length-1], k=y*N+x; if(!reach.has(k)) reach.set(k,p); };
  add([[ax,ay]]);
  for(const d1 of DIRS){
    let path=[[ax,ay]], x=ax+d1[0], y=ay+d1[1];
    while(free(x,y)){
      path=[...path,[x,y]]; add(path);
      for(const d2 of DIRS){
        if(d1[0]*d2[0]+d1[1]*d2[1]!==0) continue;   // 直角のみ
        let p2=path, x2=x+d2[0], y2=y+d2[1];
        while(free(x2,y2)){ p2=[...p2,[x2,y2]]; add(p2); x2+=d2[0]; y2+=d2[1]; }
      }
      x+=d1[0]; y+=d1[1];
    }
  }
  return reach;
}
// (ax,ay)の駒が「0回か1回曲がって」隣接できる同数字の駒 -> 経路
function targetsOf(ax, ay){
  const v = grid[ay][ax];
  if(v >= (KINDS[kind[ay][ax]].max||Infinity)) return new Map();   // その種類の最大値には合体先がない
  const reach = reachFrom(ax, ay);
  const res = new Map();
  for(const [, path] of reach){
    const [x,y]=path[path.length-1];
    for(const [dx,dy] of DIRS){
      const nx=x+dx, ny=y+dy;
      if(!inb(nx,ny) || (nx===ax&&ny===ay) || grid[ny][nx]!==v || kind[ny][nx]!==kind[ay][ax]) continue;
      const k=ny*N+nx, old=res.get(k);
      if(!old || old.length>path.length) res.set(k,path);
    }
  }
  return res;
}
// 合体できる、すべての組み合わせ(ヒント用)。同じ2つの駒の組は1つにして、短い方の経路を採る
function allMerges(){
  const best=new Map();
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    if(!grid[y][x]) continue;
    for(const [k,path] of targetsOf(x,y)){
      const a=y*N+x, key=a<k ? a+'-'+k : k+'-'+a, old=best.get(key);
      if(!old || old.path.length>path.length) best.set(key,{a:[x,y], b:[k%N,k/N|0], path});
    }
  }
  return [...best.values()];
}
// 選んだ駒の、行き先として指定されたセル c を、解決する: 相手の駒(c)でも、相手の隣の移動先のセル(c)でもよい。 -> {b:相手の位置, path:移動の経路} か null
let destCache={key:'',reach:null};
function resolveDest(c){
  if(!sel || !c) return null;
  const k=c[1]*N+c[0];
  if(targets.has(k)) return {b:c, path:targets.get(k)};                 // 相手の駒を指定
  const key=sel[0]+','+sel[1]+','+turns+','+sites.size;                  // 選んだ駒が同じ間は、止まれる場所の計算を、使い回す
  if(destCache.key!==key) destCache={key, reach:reachFrom(sel[0],sel[1])};
  const path=destCache.reach.get(k);
  if(!path || path.length<2 || grid[c[1]][c[0]]) return null;            // 移動先のセル(空いていて、動く必要がある)でなければ、無効
  const v=grid[sel[1]][sel[0]], kd=kind[sel[1]][sel[0]];
  for(const [dx,dy] of DIRS){                                            // そのセルの隣に、合体できる相手がいれば、それを相手にする
    const nx=c[0]+dx, ny=c[1]+dy;
    if(inb(nx,ny) && !(nx===sel[0]&&ny===sel[1]) && grid[ny][nx]===v && kind[ny][nx]===kd) return {b:[nx,ny], path};
  }
  return null;
}
function anyMove(){
  for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(grid[y][x] && targetsOf(x,y).size) return [x,y];
  return null;
}

const undoStack = [];
function snapshot(){
  return {grid:grid.map(r=>r.slice()), kind:kind.map(r=>r.slice()), score, turns, bestValue, bestKind, stats:JSON.parse(JSON.stringify(stats)),
    sites:[...sites.values()].map(({x,y,k,v})=>({x,y,k,v}))};
}
let hintMode=false, hintPairs=null;                                // Hint表示中: OKを押すまで駒の操作は不可
function undo(){
  if(over || mover || hintMode || !undoStack.length) return;
  const top=undoStack[undoStack.length-1];
  if(freeCount(top.grid,top.sites)<UNDO_SITES){ askGameOver('Undo',undoNow); return; }
  undoNow();
}
function undoNow(){
  if(!undoStack.length) return;
  const h=undoStack.pop(), now=performance.now();
  grid=h.grid; kind=h.kind; score=h.score; turns=h.turns; bestValue=h.bestValue; bestKind=h.bestKind!=null?h.bestKind:bestKind; stats=h.stats;
  fresh.clear(); sites.clear(); for(const st of h.sites) sites.set(siteKey(st.x,st.y),{...st,t0:now});
  anims.clear(); effects=[]; over=false; boardFull=false; stuck=false; sel=null; targets=new Map(); preview=null;
  penalty(UNDO_SITES);                              // Undoのペナルティ
  hud(); setMsg(tr('undone',UNDO_SITES)); checkGameOver();
}
function doMerge(a, b, path, confirmed){
  const v0=grid[a[1]][a[0]];
  if(v0*2>=MAXV && bestValue<MAXV && !confirmed){        // 初めて最大(1024)を作る合体: 先に、これ以上は成長しないことを知らせて、確認する
    const aa=[a[0],a[1]], bb=[b[0],b[1]], pp=path.slice();
    askQuery(tr('maxAskTitle'),tr('maxAsk',MAXV),()=>doMerge(aa,bb,pp,true),()=>{});         // 「いいえ」なら、何も起きない(選択は、そのまま)
    return;
  }
  fresh.clear();
  undoStack.push(snapshot()); if(undoStack.length>200) undoStack.shift();
  const v = grid[a[1]][a[0]];
  grid[a[1]][a[0]] = 0;
  const full = [...path, b];
  const steps = full.length-1;
  mover = {v, k:kind[a[1]][a[0]], path:full, b, t0:performance.now(), dur:Math.max(200, steps*70)/.6, x:a[0], y:a[1]};
  sfxDrag(mover.dur/1000);
  sel=null; targets=new Map();
}
// 新築予定地 (柵で囲って BUILD_MS 後に建物が出来る)
const sites = new Map();

const siteKey = (x,y) => y*N+x;
function startSite(k,avoid,quiet){                          // avoid: 新築を置かないマス(ヒントの経路など)のキーの集合
  let empt=[];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++)
    if(!grid[y][x] && terrain[y][x]===LAND && !sites.has(siteKey(x,y))) empt.push([x,y]);
  if(!empt.length){ boardFull=true; return false; }      // 満タン
  if(avoid){ const f=empt.filter(([x,y])=>!avoid.has(y*N+x)); if(f.length) empt=f; }
  { const gh=new Set(ghosts.map(g=>g.y*N+g.x)), f=empt.filter(([x,y])=>!gh.has(y*N+x)); if(f.length) empt=f; }      // 消える演出の最中のセルには、新築を置かない

// 1024(最大)を作ると、数字1と2(レベル1・2)の建物が全種類消えて更地になる。1024より小さい合体では、何も消えない

  if(nv<MAXV) return;                                    // 1024(最大)を作ったときだけ、小さい建物が消える

function puff(cx,cy,n,o={}){
  const now=performance.now();
  for(let i=0;i<n;i++){
    let a=o.ring!=null ? Math.random()*Math.PI*2 : null, vx,vy;
    if(a!=null){ vx=Math.cos(a)*o.ring; vy=Math.sin(a)*o.ring*.55; }
    else { const dx=Math.cos(o.back), dy=Math.sin(o.back), L=.7+Math.random()*.5;   // 進行方向の逆(画面上)へ長く引きずる
      vx=-(dx-dy)*o.sp*L; vy=-(dx+dy)*.5*o.sp*L; }
    let ra,rb; do{ ra=Math.random()*2-1; rb=Math.random()*2-1; }while(Math.abs(ra)+Math.abs(rb)>1);   // 土地のひし形の中のどこからでも発生
    const ox=ra*TW/2, oy=rb*TH/2;
    effects.push({type:'dust', t:now+Math.random()*60, life:650+Math.random()*350, cx:cx+ox, cy:cy+oy,
      vx, vy, rise:(o.rise||20)*(.6+Math.random()*.8)*(a!=null?1:.3), r:(o.r||7)*(.7+Math.random()*.7)});
  }
}

  const t=AC.currentTime, notes=big?[1,1.25,1.5,2,2.5,3,4]:[1,1.25,1.5,2,2.5], base=big?392:523;
  notes.forEach((m,i)=>{ const at=t+i*.085; tone(base*m,at,.55,'triangle',.15); tone(base*m*2.005,at,.35,'sine',.05); });
  const last=t+notes.length*.085;
  tone(base*2,last,.9,'sine',.1); tone(base*2.5,last,.9,'sine',.08); tone(base*3,last,.9,'sine',.07);
  for(let i=0;i<10;i++) tone(base*4*[1,1.125,1.25,1.5,1.667][i%5],last+.05*i,.25,'sine',.025);
}

let camTween=null, vp={W:800,top:0,availH:600};

// ================= 描画 =================
const proj = (x,y) => [(x-y)*TW/2, (x+y)*TH/2];
const center = (x,y) => proj(x+.5, y+.5);
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  const r=(n>>16&255)*f|0, g=(n>>8&255)*f|0, b=(n&255)*f|0;
  return `rgb(${r},${g},${b})`;
}
function poly(pts, fill, stroke, lw){
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); }
}
function diamond(x,y,k){
  const [cx,cy]=center(x,y), hw=TW/2*k, hh=TH/2*k;
  return [[cx,cy-hh],[cx+hw,cy],[cx,cy+hh],[cx-hw,cy]];
}
const logv = v => Math.round(Math.log2(v));
const heightOf = v => 10 + logv(v)*4;

function blockGeom(x,y,h,lift){
  const [cx,cy]=center(x,y), k=.84, hw=TW/2*k, hh=TH/2*k;
  return {cx,cy,hw,hh,y0:cy-lift,y1:cy-lift-h};
}
const NUM_H = 18;   // 数字の高さ(マス中心の上, 全駒共通)
function drawNum(v,k,cx,cy){
  const s=String(v);
  ctx.font=`900 ${s.length<=2?24:s.length==3?20:17}px sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineJoin='round'; ctx.lineWidth=3.5; ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.strokeText(s,cx,cy);
  ctx.fillStyle=KINDS[k].numC; ctx.fillText(s,cx,cy);
}
let glowAmt=0;                                      // 描画中の建物の発光量(0〜1)
const silCache=new Map();
function silhouette(src){                           // 不透明部分を白で塗りつぶした画像
  let c=silCache.get(src); if(c) return c;
  const W=src.naturalWidth||src.width, H=src.naturalHeight||src.height;
  c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d'); g.drawImage(src,0,0); g.globalCompositeOperation='source-in'; g.fillStyle='#fff'; g.fillRect(0,0,W,H);
  silCache.set(src,c); return c;
}
function drawSprite(x,y,v,k,grow,lift,selected,im){
  const [cx,cy]=center(x,y), sz=TW;               // 48px画像をタイル幅(64)に合わせて拡大
  ctx.imageSmoothingEnabled=false;
  const hgt=sz*Math.max(.02,grow);
  const src=showInfo?tinted(im,k):im, dx=cx-sz/2, dy=cy+TH/2-lift-hgt;
  ctx.drawImage(src, dx, dy, sz, hgt);
  if(glowAmt>0){                                    // 合体直後: 絵のシルエットが発光し、グローがフェードして消える
    const sil=silhouette(src), gl=glowAmt;
    ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.shadowColor='rgba(255,236,170,1)'; ctx.shadowBlur=26*gl*(dpr*view.s);
    ctx.globalAlpha=Math.min(1,gl*1.1); ctx.drawImage(sil, dx, dy, sz, hgt);
    ctx.shadowBlur=0; ctx.globalAlpha=gl*.7; ctx.drawImage(sil, dx, dy, sz, hgt);
    ctx.restore();
  }
}
function drawBlock(x,y,v,k,h,lift,selected){
  const im = kindImg(k,v);
  if(im) return drawSprite(x,y,v,k,h/heightOf(v),lift,selected,im);
  const g=blockGeom(x,y,h,lift), {cx,hw,hh,y0,y1}=g;
  const col=KINDS[k].top;
  // 影
  poly(diamond(x,y,.84).map(p=>[p[0]+4,p[1]+2+lift*.3]), 'rgba(0,0,0,.18)');
  poly([[cx-hw,y0],[cx,y0+hh],[cx,y1+hh],[cx-hw,y1]], shade(col,.82), 'rgba(0,0,0,.3)', 1);
  poly([[cx+hw,y0],[cx,y0+hh],[cx,y1+hh],[cx+hw,y1]], shade(col,.64), 'rgba(0,0,0,.3)', 1);
  poly([[cx,y1-hh],[cx+hw,y1],[cx,y1+hh],[cx-hw,y1]], shade(col,1.1), 'rgba(0,0,0,.45)', 1.2);
  // 窓 (高いほど増える)
  const rows=Math.min(5, Math.max(0,((h-10)/9)|0));
  for(let r=0;r<rows;r++){
    const yy = y0 - 9 - r*8;
    if(yy < y1+6) break;
    poly([[cx-hw*.7,yy+hh*.3],[cx-hw*.35,yy+hh*.5],[cx-hw*.35,yy+hh*.5-4],[cx-hw*.7,yy+hh*.3-4]],'rgba(255,255,255,.55)');
    poly([[cx+hw*.35,yy+hh*.5],[cx+hw*.7,yy+hh*.3],[cx+hw*.7,yy+hh*.3-4],[cx+hw*.35,yy+hh*.5-4]],'rgba(255,255,255,.35)');
  }
}

let view={s:1,tx:0,ty:0}, userView=null, fitS=1, dpr=1;
const MAP_CENTER_WY = (N*TH-28)/2;      // 盤面(高さ込み: 上-50 ～ 下+22)の縦方向の中心(ワールド座標)
function layout(){
  dpr=window.devicePixelRatio||1;
  const W=innerWidth, H=innerHeight;
  if(cv.width!==(W*dpr|0) || cv.height!==(H*dpr|0)){ cv.width=W*dpr|0; cv.height=H*dpr|0; }
  const hudH=$('hud').offsetHeight, top=hudH+2, availH=H-top-(innerWidth<640?26:22);
  $('mapTitle').style.top=(hudH+6)+'px';
  const bw=N*TW+8, bh=N*TH+72;                    // 余白を最小限にして、盤面をできるだけ大きく表示
  const portrait = W < H;                         // スマホの縦画面: 盤面の幅を画面の1.1倍にして、左右を5%ずつはみ出させる
  const s = PREVIEW ? Math.min(W/bw, availH/bh)*.97 : portrait ? W*1.1/bw : Math.min(W/bw, availH/bh)*1.1;      // タイトル画面の小さな絵(PREVIEW)は、はみ出さず、全体が見えるように      // 入った時の拡大: 盤面が画面より、1.1倍(上下左右に、5%ずつ)はみ出す。縦画面は幅、横画面は収まる方の長さを基準にする
  fitS=s;
  const centered = sc => ({s:sc, tx:W/2, ty:top+availH/2-MAP_CENTER_WY*sc});
  if(userView && userView.s<=s*1.0001){          // 盤面が全て収まるまで引いたら、中心をマップ中心へ
    const c=centered(userView.s);
    userView.tx+=(c.tx-userView.tx)*.2; userView.ty+=(c.ty-userView.ty)*.2;
    if(Math.abs(c.tx-userView.tx)<.3 && Math.abs(c.ty-userView.ty)<.3){ userView.tx=c.tx; userView.ty=c.ty; }
  } else if(userView && userView.s*N*TW<=W){      // マップの幅が画面幅より小さくなったら、左右は中央に寄せる(縦は自由)
    userView.tx+=(W/2-userView.tx)*.2; if(Math.abs(W/2-userView.tx)<.3) userView.tx=W/2;
  }
  vp={W,top,availH};
  if(camTween){                                    // レベルアップ: 建物へ寄る → しばらく映す → 元の視点へ戻る
    const t=performance.now()-camTween.t0, A=650, Hd=2200, B=800, C=camTween;
    const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2, lerp=(a,b,u)=>({s:a.s+(b.s-a.s)*u, tx:a.tx+(b.tx-a.tx)*u, ty:a.ty+(b.ty-a.ty)*u});
    if(t<A) userView=lerp(C.from,C.to,ease(t/A));
    else if(t<A+Hd) userView={...C.to};
    else if(t<A+Hd+B) userView=lerp(C.to, C.back||centered(s), ease((t-A-Hd)/B));
    else { userView=C.back; camTween=null; }
  }
  view=userView||centered(s);
}
const ease = t => 1+2.70158*Math.pow(t-1,3)+1.70158*Math.pow(t-1,2);

// ---- 道路のドット絵: Icons/road_<方向>.png (11種)。橋も同じ絵を使う ----
// 方向は隣り合う道の向き (N=y-1, E=x+1, S=y+1, W=x-1)。行き止まりは直線の絵で代用
const ROAD_MASKS = ['EW','NS','NE','ES','SW','NW','NES','ESW','NSW','NEW','NESW'];
const ROAD_IMGS = {};
for(const m of ROAD_MASKS) ROAD_IMGS[m]=Object.assign(new Image(),{src:`Icons/road_${m}.png`});
const ROAD_BASE = '#3a3e44';     // アスファルト色 (下地)
const roadLike = (x,y) => inb(x,y) && (terrain[y][x]===ROAD || terrain[y][x]===BRIDGE);
function roadMask(x,y){
  let m=''; for(const [d,dx,dy] of [['N',0,-1],['E',1,0],['S',0,1],['W',-1,0]]) if(roadLike(x+dx,y+dy)) m+=d;
  if(m.length<=1) return (m==='N'||m==='S') ? 'NS' : 'EW';     // 行き止まり・単独は直線で代用
  return m;
}
// 道路のマス: 縁が規則正しいドットの階段(2:1の直線)になっている画像をそのまま描く。
// 下地はちょうどのひし形を敷いて、階段の凹みや継ぎ目の隙間(背景が透ける)を隠す
function drawRoadTile(im,x,y){
  poly(diamond(x,y,1), ROAD_BASE);
  if(im && im.complete && im.naturalWidth) drawTileImg(im,x,y,false);
}
function drawTileImg(im,x,y,smooth){
  const [cx,cy]=center(x,y);
  ctx.imageSmoothingEnabled=!!smooth; ctx.imageSmoothingQuality='high';
  ctx.drawImage(im, cx-TW/2, cy+TH/2-TW, TW, TW);
}
// 商店街の石畳: ベージュの長方形の石を、1段ごとに半分ずらして敷く。石ごとに、わずかに色が違う
const PAVE_COLS=['#d0bfa6','#c9b79e','#d5c5ae','#c5b299','#cebba0'];
const STREET_W = .8;                                   // 商店街(屋根あり・なし)の道幅。マスの幅に対する割合(車道は1のまま)
const STREET_M = (1-STREET_W)/2;
const isStreet=(x,y)=>inb(x,y)&&(terrain[y][x]===SHOP||terrain[y][x]===ARC||terrain[y][x]===SBRIDGE);
function streetAxis(x,y){                              // 'NS': y方向に通る / 'EW': x方向に通る / 'X': 交差
  if(terrain[y][x]===SBRIDGE){                         // 橋: 水が左右にあれば南北、上下にあれば東西に渡る
    const w=(a,b)=>inb(a,b)&&(terrain[b][a]===WATER||terrain[b][a]===HWYW);
    return (w(x-1,y)&&w(x+1,y)) ? 'NS' : 'EW';
  }
  const n=isStreet(x,y-1)||isStreet(x,y+1), e=isStreet(x-1,y)||isStreet(x+1,y);
  return (n&&e) ? 'X' : n ? 'NS' : 'EW';
}
function paveRect(x,y,x0,x1,y0,y1){
  const R=8, TWD=.25;
  for(let r=0;r<R;r++){
    const ya=Math.max(y0,r/R), yb=Math.min(y1,(r+1)/R), off=(r&1)?TWD/2:0;
    if(yb-ya<.005) continue;
    for(let i=-1;i<5;i++){
      const a=Math.max(x0,off+i*TWD), b=Math.min(x1,off+i*TWD+TWD);
      if(b-a<.02) continue;
      const h=(x*73+y*131+r*17+i*29)&7, c=PAVE_COLS[h%PAVE_COLS.length];
      poly([proj(x+a,y+ya),proj(x+b,y+ya),proj(x+b,y+yb),proj(x+a,y+yb)], c, c, 1);     // 縁も同色にして、線を出さない
    }
  }
}
function drawStreet(x,y,green){
  if(green) poly(diamond(x,y,1), showInfo ? ((x+y)&1?'#3f8a1d':'#428f1f') : ((x+y)&1?'#55b025':'#5cba29'), 'rgba(0,0,0,.08)', 1);   // 余った所は更地と同じ緑
  const ax=streetAxis(x,y), m=STREET_M;
  if(ax!=='EW') paveRect(x,y,m,1-m,0,1);
  if(ax!=='NS') paveRect(x,y,0,1,m,1-m);
}
const CANAL_D = 10;       // 運河の掘り深さ(px)
const isPit = t => t===WATER || t===HWYW || t===SBRIDGE || t===BRIDGE || t===RAIL || t===STATION;   // 川・線路は同じ深さに掘り下げる
const wet = (x,y) => inb(x,y) && isPit(terrain[y][x]);
function faceQuad(a,b,h0,h1,fill){
  poly([[a[0],a[1]-h0],[b[0],b[1]-h0],[b[0],b[1]-h1],[a[0],a[1]-h1]], fill, fill, 1);   // 縁も同色で塗り、マス間の隙間を消す
}
// 電車・駅の色 (現実のイメージ)。京急: 赤い車体に白帯 / JR京浜東北線: シルバーの車体にスカイブルーの帯
const RAIL_STYLES = {
  keikyu:{ train:{body:'#e60012',roof:'#f4f4f4',band:'#f2f2f2'}, station:{wall:'#efe7d3',roof:'#f7f1e2',win:'#4a96e6',stripe:'#ff3434'} },
  jrwest:{ train:{body:'#d9dee2',roof:'#eef1f4',band:'#0a5db0'}, station:{wall:'#eef1f4',roof:'#c3ccd5',win:'#46688c',stripe:'#0072bc'} },     // JR西日本(新快速・京都線): 銀の車体に青い帯
  hankyu:{ train:{body:'#6e2a1d',roof:'#d9d1c0',band:'#cdb98a'}, station:{wall:'#6e2a1d',roof:'#e9dfc8',win:'#e9dfc8',stripe:'#cdb98a'} },
  jr:    { train:{body:'#cfd6dc',roof:'#eef2f5',band:'#00b2e5'}, station:{wall:'#e9eef2',roof:'#f7fafc',win:'#5f7f96',stripe:'#00b2e5'} },
};
const RSTYLE = RAIL_STYLES[MAPDEF.railStyle] || RAIL_STYLES.keikyu;
// ロープウェイの駅: 鉄道の駅とは別デザインの、小さな白い箱 (マスの半分の広さ、鉄道駅(高さ26相当)の半分の高さ13)
function drawRopewayBox(x,y){ boxC(x+.25,x+.75,y+.25,y+.75,0,13,'#ffffff'); }
function drawStationCell(x,y){
  const st = RSTYLE.station;
  const [cx,cy]=center(x,y), hw=TW/2, hh=TH/2, H=19;   // 駅ビルの高さ
  const Lp=[cx-hw,cy], Bp=[cx,cy+hh], Rp=[cx+hw,cy];
  for(const [a,b,f] of [[Lp,Bp,.9],[Bp,Rp,.74]]){
    faceQuad(a,b,0,H,shade(st.wall,f));
    faceQuad(a,b,H*.18,H*.5,shade(st.win,f));        // 窓
    faceQuad(a,b,H*.72,H*.9,shade(st.stripe,f));     // 帯
  }
  poly([[cx,cy-H-hh],[cx+hw,cy-H],[cx,cy-H+hh],[cx-hw,cy-H]], st.roof, st.roof, 1.5);   // 屋上: 縁も同色にしてマス間の線を出さない
}
function drawGround(now){
  // 運河・線路: 少し低い位置に水面・線路の面を描く(切り抜かない = 手前の縁では面が縁の外へはみ出し、断面の上につながる)
  ctx.save();
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const t=terrain[y][x];
    if(!isPit(t)) continue;
    const w=.5+.5*Math.sin(now/600+x*.9+y*.6);
    const d=diamond(x,y,1).map(p=>[p[0],p[1]+CANAL_D]);
    poly(d, t===RAIL ? '#4a4748' : t===STATION ? '#bdb8aa' : `rgb(${40+w*14|0},${140+w*20|0},${240+w*12|0})`);
  }
  // 掘り込みの壁 (奥側の2辺)
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const tt=terrain[y][x];
    if(!isPit(tt)) continue;
    const T=proj(x,y), R=proj(x+1,y), L=proj(x,y+1);
    if(tt===BRIDGE || tt===SBRIDGE){                                       // 盤面の奥の端(上・左)にある橋: 橋の下から、盤面の外の空が透けて見えないように、奥に壁を描く
      if(y===0) poly([T,R,[R[0],R[1]+CANAL_D],[T[0],T[1]+CANAL_D]], '#8a7a66');
      if(x===0) poly([T,L,[L[0],L[1]+CANAL_D],[T[0],T[1]+CANAL_D]], '#6f624f');
    }
    if(inb(x,y-1) && !wet(x,y-1)) poly([T,R,[R[0],R[1]+CANAL_D],[T[0],T[1]+CANAL_D]], '#8a7a66');
    if(inb(x-1,y) && !wet(x-1,y)) poly([T,L,[L[0],L[1]+CANAL_D],[T[0],T[1]+CANAL_D]], '#6f624f');
  }
  ctx.restore();
  // 手前2辺の側面(断面)。掘り下げた水面・線路の面がはみ出す部分より後に描いて、道路などの地面の断面が欠けないようにする。
  //   運河・線路のマスは、掘り下げた高さ(CANAL_D)から下を水・線路の色で描く
  //   (その上の部分は、掘り下げた水面・線路の面そのものが盤面の縁からはみ出して見える)
  const sectionCol = t => (t===WATER||t===HWYW||t===BRIDGE||t===SBRIDGE) ? '#2a8ff5' : t===RAIL ? '#4a4748' : t===STATION ? '#bdb8aa' : null;
  for(let i=0;i<N;i++){
    for(const [edge,t] of [[0,terrain[N-1][i]],[1,terrain[i][N-1]]]){
      const c=sectionCol(t), f=edge?.7:.86;
      const p=edge?proj(N,i):proj(i,N), q=edge?proj(N,i+1):proj(i+1,N);
      const quad=(z0,z1,fill)=>poly([[p[0],p[1]+z0],[q[0],q[1]+z0],[q[0],q[1]+z1],[p[0],p[1]+z1]], fill, fill, 1);
      if(c) quad(CANAL_D,22,shade(c,f));           // 水面・線路の面は描画側(下の drawGround)に任せ、断面は掘り下げた高さから下だけ
      else quad(0,22, edge?'#3e2723':'#5d4037');
    }
  }
  // 船: 水面のあと・陸地の前に描く(= 地面より向こう側。手前の地面が船の下の部分を隠す)
  for(const sh of MAPDEF.ships||[]) drawShip(sh,now);
  // 陸地
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const t=terrain[y][x];
    if(t===WATER || t===HWYW || t===RAIL || t===STATION) continue;
    if(t===BRIDGE || t===SBRIDGE){
      const sb=t===SBRIDGE, ax=sb?streetAxis(x,y):'X', mx=(sb&&ax==='NS')?STREET_M:0, my=(sb&&ax==='EW')?STREET_M:0;   // 歩行者の橋は幅8割
      const Lp=proj(x+mx,y+1-my), Bp=proj(x+1-mx,y+1-my), Rp=proj(x+1-mx,y+my);
      poly([Lp,Bp,[Bp[0],Bp[1]+6],[Lp[0],Lp[1]+6]],sb?'#8d8a82':'#6d4c41');
      poly([Bp,Rp,[Rp[0],Rp[1]+6],[Bp[0],Bp[1]+6]],sb?'#6f6c65':'#4e342e');
      continue;                                   // 橋の路面は、下の「道路を最後に描く」でほかの道路と同じに描く
    }
    if(t===ROAD) continue;                        // 道路は、更地を描いたあとにまとめて描く
    if(t===SHOP || t===ARC){ drawStreet(x,y,true); continue; }   // 商店街の石畳(道幅は8割。余りは緑)
    if(t===VIA || t===VSTN || t===HKST){ poly(diamond(x,y,1), t===HKST?'#a9a69f':'#8c8a84', 'rgba(0,0,0,.08)', 1); continue; }   // 高架の下・駅の足元
    let col;
    col = showInfo ? ((x+y)&1?'#3f8a1d':'#428f1f') : ((x+y)&1?'#55b025':'#5cba29');   // ラベルOFF時は更地も明るめに
    poly(diamond(x,y,1), col, 'rgba(0,0,0,.08)', 1);
  }
  // 線路 (2本のレール。川と同じ深さ)
  ctx.save(); ctx.translate(0,CANAL_D);
  const isRail=(x,y)=>inb(x,y)&&(terrain[y][x]===RAIL||terrain[y][x]===STATION);
  ctx.strokeStyle='#9a9a9a'; ctx.lineWidth=2;
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    if(terrain[y][x]!==RAIL) continue;
    for(const [dx,dy] of [[1,0],[0,1],[-1,0],[0,-1]]){
      if(!isRail(x+dx,y+dy)) continue;
      for(const o of [-.18,.18]){
        const px=dy?o:0, py=dx?o:0;
        const [x0,y0]=proj(x+.5+px,y+.5+py), [x1,y1]=proj(x+.5+dx*.5+px,y+.5+dy*.5+py);
        ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();

  ctx.restore();
  // 道路は、線路よりも常に手前に描く
  // 道路を最後に描く: 道路のドット絵の縁(規則正しい階段)が、隣の更地の上に重なって、隙間なく同じ見え方になる
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const t=terrain[y][x];
    if(t===ROAD) drawRoadTile(ROAD_IMGS[roadMask(x,y)],x,y);
    else if(t===SBRIDGE) drawStreet(x,y,false);
    else if(t===BRIDGE) drawRoadTile(ROAD_IMGS[wet(x-1,y)&&wet(x+1,y) ? 'NS' : 'EW'],x,y);   // 橋は専用テクスチャなし。普通の直線道路と同じ
  }
}

// 工事のあと、柵が残っている間の建物: 十字型のグロー(4方向に細く伸びる光)が、ゆっくり、ちかちかする。小さく、控えめに。
//   同時に4つ(周期をずらして、3〜4個が見える)。光るたびに、場所を変える(前と同じ場所には出さない。4つの光は、場所の候補を分け合うので、同時に同じ場所にもならない)
const SPARK_SPOTS = [[11,-3],[-9,3],[3,-9],[-13,-6],[14,5],[-3,9],[8,12],[-8,-11],[-12,7],[2,-13],[13,-9],[-5,13],[-14,0],[6,-6],[-1,-5],[12,1]];   // 建物の上のあたりの、出現場所の候補(建物の中心の x、上端の y からのずれ)。16か所
const SPARK_SLOTS = [[1245,0,1],[1467,.37,.75],[1333,.71,.6],[1600,.19,.5]];             // [周期ms, 位相, 大きさ]。最初の2.25倍の速さ(1.5倍を2回)。光 k は、番号が k, k+4, k+8, k+12 の4か所だけを使う
const SPARK_UP = 11;                                                                       // きらめきを、建物の上へ、このぶん(px)ずらす
const SPARK_T0 = new Map();                                                              // 柵が出てから(きらめきを始めてから)の時刻
const sparkHash = (a,b) => { const h=Math.sin(a*12.9898+b*78.233)*43758.5453; return h-Math.floor(h); };
function sparkIdx(cyc,slot,key){                     // cyc 回目に光る場所の番号(0..3)。1つ前の回から、必ず別の場所へ進む
  let i=Math.floor(sparkHash(key,slot+1)*4);
  for(let c=1;c<=cyc;c++) i=(i+1+Math.floor(sparkHash(c+slot*101,key)*3))%4;
  return i;
}
function drawFreshSparkles(now){
  for(const k of SPARK_T0.keys()) if(!fresh.has(k)) SPARK_T0.delete(k);
  if(!fresh.size) return;
  ctx.save();
  for(const key of fresh){
    const fx=key%N, fy=key/N|0, v=grid[fy][fx]; if(!v) continue;
    if(!SPARK_T0.has(key)) SPARK_T0.set(key,now);
    const el=now-SPARK_T0.get(key), [cx,cy]=center(fx,fy), top=cy-heightOf(v);
    SPARK_SLOTS.forEach(([per,ph,sz],slot)=>{
      const u=el/per+ph, cyc=Math.floor(u), t=u-cyc, s=.5-.5*Math.cos(t*Math.PI*2);        // 0 → 1 → 0 を、ゆっくりくり返す
      if(s<.04) return;
      const [dx,dy]=SPARK_SPOTS[slot+4*sparkIdx(cyc,slot,key)], x=cx+dx, y=top+dy-SPARK_UP, L=(4.5+6*s)*sz, w=(.8+.6*s)*sz, a=Math.min(1,.28+.62*s);
      const g=ctx.createRadialGradient(x,y,0,x,y,L*.9); g.addColorStop(0,`rgba(255,248,215,${Math.min(1,a*.95)})`); g.addColorStop(1,'rgba(255,248,215,0)');
      ctx.globalAlpha=1; ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,L*.9,0,Math.PI*2); ctx.fill();          // やわらかい、小さなグロー
      ctx.globalAlpha=a; ctx.fillStyle='#fffbe6';
      ctx.beginPath(); ctx.moveTo(x-L,y); ctx.lineTo(x,y-w); ctx.lineTo(x+L,y); ctx.lineTo(x,y+w); ctx.closePath(); ctx.fill();         // 横の光
      ctx.beginPath(); ctx.moveTo(x,y-L*1.25); ctx.lineTo(x+w,y); ctx.lineTo(x,y+L*1.25); ctx.lineTo(x-w,y); ctx.closePath(); ctx.fill(); // 縦の光
    });
  }
  ctx.restore();
}

// ---- 中華街の門(牌楼): 道路をまたぐ。axis は道路の走る向き。柱は道路の両脇、面は道路をまたぐ向き ----
function boxAx(g,u0,u1,v0,v1,z0,z1,col,top){     // u: 道路をまたぐ向き / v: 道路に沿う向き
  const {x,y}=g, sw=g.sw||1, sz=g.sz||1;            // sw: 幅の倍率(道路をまたぐ向き) / sz: 高さの倍率
  u0=.5+(u0-.5)*sw; u1=.5+(u1-.5)*sw; z0*=sz; z1*=sz;
  if(g.axis==='NS') boxC(x+u0,x+u1,y+v0,y+v1,z0,z1,col,top); else boxC(x+v0,x+v1,y+u0,y+u1,z0,z1,col,top);
}
function drawGate(g0,part){

  const RED=g0.col||'#d3262b', GOLD='#e8b923', GRN=g0.roof||'#1f9d6b', STONE='#9a948a';   // RED: この門の柱・梁の色 / GRN: 屋根瓦の色(どちらも門ごとに違う)
  const pillar=u=>{ boxAx(g,u-.02,u+.14,.42,.58,0,4,STONE); boxAx(g,u,u+.12,.44,.56,4,32,RED); };
  if(part===0){ pillar(.08); return; }
  pillar(.80);
  boxAx(g,.08,.92,.45,.55,23,29,RED);                  // 梁(下)

  boxAx(g,.02,.98,.36,.64,32,35,GOLD);                 // 屋根の縁(金)
  boxAx(g,.0,1.0,.38,.62,35,38,GRN);                   // 屋根(緑の瓦)
  boxAx(g,.3,.7,.44,.56,38,45,RED);                    // 中央の高い部分
  boxAx(g,.26,.74,.40,.60,45,47,GOLD);

// ---- みなとみらいのゴンドラ: 道の上(赤)から乗り場(緑)まで、ケーブルに沿って2台が逆向きに往復する ----
const GOND = MAPDEF.gondola || null;
const GOND_SPEED=.165, GOND_WAIT=2.5, GOND_Z=46;   // 速さは以前(.55)の3割
function gondolaS(now){                             // 2台の位置(パス上の距離, 0〜L)
  const L=GOND.path.length-1, T=L/GOND_SPEED, P=2*(T+GOND_WAIT), tt=(now/1000)%P;
  let f;                                            // 0→1→0 の往復 (端で止まり、動き出しと着く直前はなめらか)
  if(tt<GOND_WAIT) f=0; else if(tt<GOND_WAIT+T){ const u=(tt-GOND_WAIT)/T; f=u*u*(3-2*u); }
  else if(tt<2*GOND_WAIT+T) f=1; else { const u=(tt-2*GOND_WAIT-T)/T; f=1-u*u*(3-2*u); }
  return [f*L,(1-f)*L];
}
function gondolaPt(s){                              // パス上の距離 s のワールド座標と、ケーブルの高さ
  const path=GOND.path, L=path.length-1, i=Math.min(L-1,Math.floor(s)), f=s-i;
  const x=path[i][0]+.5+(path[i+1][0]-path[i][0])*f, y=path[i][1]+.5+(path[i+1][1]-path[i][1])*f;
  const kE=Math.max(0,Math.min(1,(s-(L-1.3))/1.3)), kS=Math.max(0,Math.min(1,(1.3-s)/1.3));   // 両端の乗り場の手前でケーブルが下がり、駅の建物へ入る
  const k=Math.max(kE,kS);
  return [x,y,GOND_Z+(17-GOND_Z)*k*k*(3-2*k)];
}
function gondolaItems(items,now){
  if(!GOND) return;
  const path=GOND.path, L=path.length-1;
  for(let i=0;i<L;i++){                             // ケーブル(セグメントごと)
    const a=path[i], b=path[i+1];
    items.push({x:a[0],y:a[1],d:(a[0]+a[1]+b[0]+b[1])/2+1,gd:()=>{
      const [x0,y0,z0]=gondolaPt(i), [x1,y1,z1]=gondolaPt(i+1), p0=proj(x0,y0), p1=proj(x1,y1);
      ctx.save(); ctx.strokeStyle='#3b3f44'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(p0[0],p0[1]-z0); ctx.lineTo(p1[0],p1[1]-z1); ctx.stroke(); ctx.restore();
    }});
  }
  GOND.cab=gondolaS(now);
  GOND.cab.forEach((s,k)=>{
    const [x,y,z]=gondolaPt(s);
    items.push({x,y,d:x+y+.2,gd:()=>{
      const [px,py]=proj(x,y);
      const col=k?'#2f6fd6':'#e53935';                            // 下半分: 1台は赤、もう1台は青
      boxC(x-.13,x+.13,y-.13,y+.13,z-17,z-12,col);                // ゴンドラ本体(下半分)
      boxC(x-.13,x+.13,y-.13,y+.13,z-12,z-7,'#8fd0f0');           // 上半分: 水色(ガラス)
      // ケーブルとつなぐ灰色の吊り棒: 水色の屋根(上面)の中心から、真上のケーブルの高さまで。屋根を描いたあとに描く
      ctx.save(); ctx.strokeStyle='#3b3f44'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(px,py-(z-7)); ctx.lineTo(px,py-z); ctx.stroke(); ctx.restore();
    }});
  });
}

// ---- 大阪のランドマーク(ポリゴン): 海遊館(K) / 観覧車(F。回る) / 天保山(Z) ----
// 海遊館: 正面が右下(+x)を向く。壁画の紺の大きな壁の上に、左右2つの大きな棟(外側が高く、中央へゆるく下がる屋根)。
//   棟は、下から、紺(壁画)→ 赤い帯(下は水平、上は屋根と平行の斜め)→ 青いガラス。中央は、壁画の暗い壁に、ジンベエザメと、上に金色の門。
function drawKaiyukan(x,y){
  const ZS=.8;                                                                          // 縦(高さ)を2割つぶす。平面の大きさは、そのまま
  const cx=x+.5, cy=y+.5, P=(wx,wy,z)=>{ const [a,b]=proj(wx,wy); return [a,b-z*ZS]; };
  const B=(xa,xb,ya,yb,z0,z1,c,t)=>boxC(xa,xb,ya,yb,z0*ZS,z1*ZS,c,t);
  const R=(u,v,z)=>P(cx+v,cy+u,z);                                                      // u: 棟が並ぶ向き(y)、v: 奥行き(x。+v が正面=右下)
  const NAVY='#2a3f78', RED='#d12a3a', GLASS='#4a7fae';

  for(let k=0;k<=4;k++){ const u=x+k/4, q=P(u,y+v1,ZL-2.2), r=P(u+(k<4?.125:0),y+v1,ZL-7); ctx.moveTo(q[0],q[1]); ctx.lineTo(r[0],r[1]); if(k<4){ const t=P(u+.25,y+v1,ZL-2.2); ctx.lineTo(t[0],t[1]); } }   // ジグザグのトラス

  poly([P(x-e,y+v0,ZH),P(x+1+e,y+v0,ZH),P(x+1+e,y+v1,ZL),P(x-e,y+v1,ZL)],'#c2ced8','#c2ced8',1);
  ctx.save(); ctx.lineWidth=.9;

  ctx.restore();

// 通天閣: すべて斜め(テーパー)の面でできた、中の見えない塔。下は白い三角の4つ足と、青いガラスの低い棟。
//   その上に、細くなる鉄骨色の塔身(外側に斜めの筋交いと、白い大きな縦文字「OSAKA」)。上部に菱形の張り出し。
//   一番上は、上ほど広がる逆台形(上から見ると八角形)の展望台(ガラスの2段)と、小さな頂部、アンテナ
function drawTsutenkaku(x,y){
  const cx=x+.5, cy=y+.5, P=(wx,wy,z)=>{ const [a,b]=proj(wx,wy); return [a,b-z]; };
  // 四角錐台(塔身用): h0=下の半幅 h1=上の半幅
  const fr=(h0,h1,z0,z1,col,top)=>{
    poly([P(cx+h0,cy-h0,z0),P(cx+h0,cy+h0,z0),P(cx+h1,cy+h1,z1),P(cx+h1,cy-h1,z1)],shade(col,.7),shade(col,.7),1);
    poly([P(cx-h0,cy+h0,z0),P(cx+h0,cy+h0,z0),P(cx+h1,cy+h1,z1),P(cx-h1,cy+h1,z1)],shade(col,.86),shade(col,.86),1);
    if(top) poly([P(cx-h1,cy-h1,z1),P(cx+h1,cy-h1,z1),P(cx+h1,cy+h1,z1),P(cx-h1,cy+h1,z1)],top,top,1);
  };
  // 八角錐台(展望台用): r0=下の半径 r1=上の半径。見える側面と上面
  const oc=(r0,r1,z0,z1,col,top)=>{
    const V=(r,k)=>{ const t=(k+.5)*Math.PI/4; return [cx+r*Math.cos(t),cy+r*Math.sin(t)]; };
    for(let k=0;k<8;k++){ const nx=Math.cos((k+1)*Math.PI/4), ny=Math.sin((k+1)*Math.PI/4); if(nx+ny<=1e-9) continue;
      const A0=V(r0,k),B0=V(r0,(k+1)%8),A1=V(r1,k),B1=V(r1,(k+1)%8), f=.7+.16*Math.max(0,ny)/(Math.abs(nx)+Math.abs(ny)+1e-9);
      poly([P(A0[0],A0[1],z0),P(B0[0],B0[1],z0),P(B1[0],B1[1],z1),P(A1[0],A1[1],z1)],shade(col,f),shade(col,f),1); }
    if(top) poly(Array.from({length:8},(_,k)=>{ const v=V(r1,k); return P(v[0],v[1],z1); }),top,top,1);
  };
  const F=(face,h0,h1,z0,z1,t,u)=>{ const h=h0+(h1-h0)*t, z=z0+(z1-z0)*t; return face==='X'?P(cx+h,cy+u*h,z):P(cx+u*h,cy+h,z); };
  const line=(a,b,c,w)=>{ ctx.strokeStyle=c; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); };
  const fillq=(pts,c)=>{ ctx.fillStyle=c; ctx.beginPath(); pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath(); ctx.fill(); };

  poly(diamond(x,y,1),'#565a62','rgba(0,0,0,.08)',1);                                   // 足元の地面(商店系の建物の下と同じアスファルト色)
  fillq([P(cx-.4,cy-.4,.1),P(cx+.4,cy-.4,.1),P(cx+.4,cy+.4,.1),P(cx-.4,cy+.4,.1)],'rgba(20,22,28,.3)');   // 棟の下の影(脚の間は吹き抜け)
  // --- 下の4本の脚(白い脚。下ほど外へ張り出し、逆テーパーで下ほど細くなる)。脚の間は何もなく、下を通れる ---
  const ZL=12;
  const LT=.3, LB=.45, HT=.1, HB=.045;                                                    // 上(棟の四隅)の位置/太さ、下(地面)の位置/太さ
  const leg=(sx,sy)=>{
    const top=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>[cx+sx*LT+a*HT, cy+sy*LT+b*HT, ZL]);
    const bot=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>[cx+sx*LB+a*HB, cy+sy*LB+b*HB, 0]);
    // 4つの側面のうち、手前に見える面(+x 側と +y 側)だけ描く
    const q=(i,j,c)=>{ const pts=[top[i],top[j],bot[j],bot[i]].map(v=>P(v[0],v[1],v[2])); poly(pts,c,c,1); };
    q(2,3,'#f1f1ee');                                                                      // +y 側の面
    q(1,2,'#d9dad8');                                                                      // +x 側の面
    // 脚の縁(細い影)
    ctx.save(); ctx.strokeStyle='#aeb2b4'; ctx.lineWidth=1; ctx.beginPath(); [[2,3],[1,2]].forEach(([i,j])=>{ const t0=P(top[i][0],top[i][1],ZL), b0=P(bot[i][0],bot[i][1],0), t1=P(top[j][0],top[j][1],ZL), b1=P(bot[j][0],bot[j][1],0); ctx.moveTo(t0[0],t0[1]); ctx.lineTo(b0[0],b0[1]); ctx.moveTo(t1[0],t1[1]); ctx.lineTo(b1[0],b1[1]); }); ctx.stroke(); ctx.restore();
  };
  leg(-1,-1);                                                                              // 奥 → 手前の順に描く(筋交いはなし)
  leg(1,-1); leg(-1,1);
  leg(1,1);
  // --- 青いガラスの低い棟(2階分。屋上に縁) ---
  boxC(cx-.4,cx+.4,cy-.4,cy+.4,ZL,ZL+13,'#cfd8dc','#dfe6e9');
  for(const z of [ZL+1.5,ZL+7.5]) boxC(cx-.402,cx+.402,cy-.402,cy+.402,z,z+4.2,'#5d8197');   // 窓の帯(2段)
  boxC(cx-.42,cx+.42,cy-.42,cy+.42,ZL+13,ZL+14.5,'#ecefef','#f6f8f8');                      // 屋上の縁
  // --- 張り出し(菱形のトラス): 奥の2面は塔身より先、手前の2面は塔身のあと ---
  const T0=.31, T1=.115, Z0=ZL+14.5, Z1=96, ZW=86, hw=T0+(T1-T0)*((ZW-Z0)/(Z1-Z0));
  const wing=(dx,dy)=>{
    const o=.26, tipz=ZW+1;
    const A=P(cx+dx*hw,cy+dy*hw,ZW-7), B=P(cx+dx*(hw+o),cy+dy*(hw+o),tipz), Cc=P(cx+dx*hw,cy+dy*hw,ZW+8), Dd=P(cx+dx*(hw+o*.55),cy+dy*(hw+o*.55),tipz);
    line(A,B,'#8393a0',1.4); line(B,Cc,'#8393a0',1.4); line(A,Dd,'#62727e',1); line(Dd,Cc,'#62727e',1);
  };
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round'; wing(-1,0); wing(0,-1); ctx.restore();
  // --- 塔身: 上ほど細くなる、中の見えない鉄骨色の錐台 ---
  fr(T0,T1,Z0,Z1,'#34414b');
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
  for(const face of ['X','Y']){
    const L=(t0,u0,t1,u1,c,w)=>line(F(face,T0,T1,Z0,Z1,t0,u0),F(face,T0,T1,Z0,Z1,t1,u1),c,w);
    const lv=[0,.17,.34,.5,.65,.8,.93];
    for(let k=0;k<lv.length-1;k++){ L(lv[k],-1,lv[k+1],1,'#62727e',1.1); L(lv[k],1,lv[k+1],-1,'#62727e',1.1); }
    for(const t of lv) L(t,-1,t,1,'#7b8b97',1.2);
    L(0,-1,.97,-1,'#8393a0',1.8); L(0,1,.97,1,'#8393a0',1.8);
  }
  // 中央の青灰色の帯と、白い大きな縦文字「OSAKA」(上から O S A K A)。下の棟の上から、上の張り出しの手前まで
  for(const face of ['X','Y']){
    const G=(t,uc)=>{ const h=T0+(T1-T0)*t, z=Z0+(Z1-Z0)*t; return face==='X'?P(cx+h,cy+uc,z):P(cx+uc,cy+h,z); };     // uc: 面の中心からの横のずれ(マス。高さによらず一定の幅)
    fillq([G(.01,-.1),G(.01,.1),G(.7,.1),G(.7,-.1)],face==='X'?'#4f6a79':'#5c7a8b');
    const W='#f6f6f2', lw=2.3, hgt=.118, gap=.012, top=.69;
    const letters=['O','S','A','K','A'];
    letters.forEach((ch,i)=>{
      const t1=top-i*(hgt+gap), t0=t1-hgt, tm=(t0+t1)/2, uu=.07;
      const S=(pts)=>{ ctx.strokeStyle=W; ctx.lineWidth=lw; ctx.lineJoin='round'; ctx.beginPath(); pts.forEach(([t,u],k)=>{ const q=G(t,u); k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]); }); ctx.stroke(); };
      if(ch==='O') S([[t1,-uu],[t1,uu],[t0,uu],[t0,-uu],[t1,-uu]]);
      if(ch==='S') S([[t1,uu],[t1,-uu],[tm,-uu],[tm,uu],[t0,uu],[t0,-uu]]);
      if(ch==='A'){ S([[t0,-uu],[t1,0],[t0,uu]]); S([[t0+hgt*.35,-uu*.55],[t0+hgt*.35,uu*.55]]); }
      if(ch==='K'){ S([[t1,-uu],[t0,-uu]]); S([[t1,uu],[tm,-uu],[t0,uu]]); }
    });
  }
  ctx.restore();
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round'; wing(1,0); wing(0,1); ctx.restore();
  // --- 展望台: 上ほど広がる逆台形(上から見ると八角形)。ガラスの2段 ---
  const D0=Z1;                                                                           // 下の4割を切った展望台(広い側から始まる)
  oc(.115,.28,D0,D0+1.4,'#e9ecee','#f3f5f6');                                            // 塔身から広がる白い台座
  oc(.28,.31,D0+1.4,D0+3.8,'#46657c','#5b7d95');                                         // 下段のガラス(残り)
  oc(.31,.33,D0+3.8,D0+5.8,'#e9ecee','#f3f5f6');                                         // 白い帯(せり出し)
  oc(.33,.4,D0+5.8,D0+14.8,'#46657c','#5b7d95');                                         // 上段のガラス(さらに広がる)
  for(const z of [D0+8.8,D0+11.8]) oc(.33+.07*((z-D0-5.8)/9),.33+.07*((z+.9-D0-5.8)/9),z,z+.9,'#c4cfd6');
  oc(.4,.42,D0+14.8,D0+17.3,'#e9ecee','#f3f5f6');                                        // 屋根の縁(白)
  oc(.17,.19,D0+17.3,D0+22.8,'#3d566a','#51697c');                                       // 頂部の小さなガラスの棟
  oc(.19,.21,D0+22.8,D0+24.8,'#d9dee2','#e8ecef');
  boxC(cx-.012,cx+.012,cy-.012,cy+.012,D0+24.8,D0+46.8,'#b8c0c7');                        // アンテナ
}

// 高速道路(高架): 道路より高い位置を南北に通る。橋脚は下(水の上なら水底)まで届く。下の道とは、つながらない
const DECK_Z0=13, DECK_Z1=16;

    ctx.save(); ctx.strokeStyle='#f7f7f7'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(ax,ay-DECK_Z1); ctx.lineTo(bx,by-DECK_Z1); ctx.stroke(); ctx.restore();

// ---- 車 ----
const CAR_SPEED=.9;   // 全車共通の速さ(マス/秒)
const CAR_COUNT=10;
const CAR_COLORS=['#e53935','#fdd835','#1e88e5','#f5f5f5','#43a047','#ff7043','#37474f','#8e24aa'];
const isRoadCell=(x,y)=>inb(x,y)&&(terrain[y][x]===ROAD||terrain[y][x]===BRIDGE);
const cars=[];
function pickNext(c){
  const opts=DIRS.filter(([dx,dy])=>isRoadCell(c.tx+dx,c.ty+dy) && !(dx===-c.dx&&dy===-c.dy));
  if(!opts.length) return [-c.dx,-c.dy];
  const straight=opts.find(([dx,dy])=>dx===c.dx&&dy===c.dy);
  if(straight && Math.random()<.7) return straight;
  return opts[Math.random()*opts.length|0];
}
function initCars(n){
  const roads=[];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(isRoadCell(x,y)) roads.push([x,y]);
  shuffle(roads);
  for(let i=0;i<n && i<roads.length;i++){
    const [x,y]=roads[i];
    const d=DIRS.filter(([dx,dy])=>isRoadCell(x+dx,y+dy));
    if(!d.length) continue;
    const [dx,dy]=d[Math.random()*d.length|0];
    cars.push({gx:x,gy:y,tx:x+dx,ty:y+dy,dx,dy,t:Math.random(),sp:CAR_SPEED,
      ox:0,oy:0,col:CAR_COLORS[Math.random()*CAR_COLORS.length|0]});
  }
}
function updateCars(dt){
  for(const c of cars){
    c.t+=c.sp*dt;
    while(c.t>=1){
      c.t-=1; c.gx=c.tx; c.gy=c.ty;
      const [dx,dy]=pickNext(c); c.dx=dx; c.dy=dy; c.tx=c.gx+dx; c.ty=c.gy+dy;
    }
    // 左側通行: 進行方向の左へ寄せる (なめらかに追従)
    const k=Math.min(1,dt*8);
    c.ox+=(c.dy*.2-c.ox)*k; c.oy+=(-c.dx*.2-c.oy)*k;
  }
}
function boxC(xa,xb,ya,yb,z0,z1,col,topCol){
  const P=(x,y,z)=>{const [a,b]=proj(x,y); return [a,b-z];};
  poly([P(xa,yb,z0),P(xb,yb,z0),P(xb,yb,z1),P(xa,yb,z1)], shade(col,.86));     // 左面
  poly([P(xb,yb,z0),P(xb,ya,z0),P(xb,ya,z1),P(xb,yb,z1)], shade(col,.7));     // 右面
  poly([P(xa,ya,z1),P(xb,ya,z1),P(xb,yb,z1),P(xa,yb,z1)], topCol||shade(col,1.12));   // 上面は一番明るく(真上からの光)
}
function drawCar(c){
  const px=c.gx+(c.tx-c.gx)*c.t+c.ox+.5, py=c.gy+(c.ty-c.gy)*c.t+c.oy+.5;
  const horiz=c.dx!==0, L=.2, W=.1;
  const r=(l,w)=>horiz?[px-l,px+l,py-w,py+w]:[px-w,px+w,py-l,py+l];
  // タイヤ: 奥側 → 車体 → 手前側 の順に描く
  const wheel=(l,side)=>{
    const wx=horiz?px+l:px+side, wy=horiz?py+side:py+l, a=.05, t=.025;
    boxC(wx-(horiz?a:t),wx+(horiz?a:t),wy-(horiz?t:a),wy+(horiz?t:a),0,3.5,'#1b1b1b');
  };
  for(const l of [-.12,.12]) wheel(l,-(W+.005));
  boxC(...r(L,W),1.5,5.5,c.col);
  boxC(...r(L*.5,W*.85),5.5,9,'#cfe3f1');
  for(const l of [-.12,.12]) wheel(l,W+.005);
}

// ---- 電車 (京急: 赤い車体に白帯。線路を往復し、駅の中を通り抜ける。縦({x:列})・横({y:行})どちらの線路にも対応) ----
const TRAIN_COL = !!(MAPDEF.train && MAPDEF.train.x !== undefined);       // true: 縦(y方向)に走る
const TRAIN_L = (MAPDEF.train ? (TRAIN_COL ? MAPDEF.train.x : MAPDEF.train.y) : 0) + .5;   // 線路の位置
const TRAIN_CARS = 4, TRAIN_SPEED = 7;
const TRAIN_WAIT = 42.5;    // 次に走るまでの待ち時間(秒)
const TRAIN_EXT = PREVIEW ? 0 : 30;                            // 盤面の外へ続く線路の長さ(マス)。画面の外まで届く長さ
const TRAIN_START = -TRAIN_EXT+4, TRAIN_END = N+TRAIN_EXT-4;   // 電車は、盤面の外の線路を通って画面の外から画面の外まで走る
const train = {sc:TRAIN_START, dir:1, wait:8, stop:0, done:new Set()};   // done: 停車済みの駅
const STATION_STOP = 3;     // 駅での停車時間(秒)
const ELEV = !!MAPDEF.elev, ELEV_Z0=13, ELEV_Z1=16;   // 高架: 線路の面の高さ(0.5マス ≒ タイルの高さ(32)の半分)
const STATION_CS = (()=>{                          // 線路に沿った、駅(連続する駅マス)ごとの中央
  const on=[]; for(let c=0;c<N;c++){ const x=TRAIN_COL?Math.floor(TRAIN_L):c, y=TRAIN_COL?c:Math.floor(TRAIN_L); on.push(terrain[y][x]===STATION||terrain[y][x]===VSTN||VSX.has(y*N+x)); }
  const out=[]; for(let c=0;c<N;c++) if(on[c]){ let e=c; while(e+1<N && on[e+1]) e++; out.push((c+e+1)/2); c=e; }
  return out;
})();
function updateTrain(dt){
  if(train.wait>0){ train.wait-=dt; return; }
  if(train.stop>0){ train.stop-=dt; return; }
  const prev=train.sc;
  train.sc += train.dir*TRAIN_SPEED*dt;
  for(const c of STATION_CS){                       // 各駅の中央で停車してから、また線路に沿って走り続ける
    if(!train.done.has(c) && (prev-c)*(train.sc-c)<=0){ train.sc=c; train.stop=STATION_STOP; train.done.add(c); break; }
  }
  if((train.dir>0 && train.sc>=TRAIN_END) || (train.dir<0 && train.sc<=TRAIN_START)){ train.dir*=-1; train.wait=TRAIN_WAIT; train.done.clear(); }
}
function trainItems(items){
  if(!MAPDEF.train) return;
  const a=1;                                          // フェードせず、盤面の端で切れて出入りする
  for(let i=0;i<TRAIN_CARS;i++){
    const ac=train.sc+(i-(TRAIN_CARS-1)/2)*1.0;      // 線路に沿った位置
    // 駅のマスより先に描いて、駅の建物で隠す(=駅に入る)
    items.push({x:TRAIN_COL?TRAIN_L:ac, y:TRAIN_COL?ac:TRAIN_L, d:ELEV ? Math.floor(TRAIN_L)+Math.floor(ac+.46)+.6 : Math.floor(TRAIN_L)+Math.floor(ac-.46)-.5, tr:{ac,a}});
  }
}
// 線路が道路の下を通るマス: 電車を描いたあとに道路を描き直して、電車を隠す(=道路の下をくぐる)
function trainCoverItems(items){
  if(!MAPDEF.train || ELEV) return;                    // 高架は、道路の上を通る(隠さない)
  const lc=Math.floor(TRAIN_L);
  for(let c=0;c<N;c++){
    const x=TRAIN_COL?lc:c, y=TRAIN_COL?c:lc, t=terrain[y][x];
    if(t===ROAD || t===BRIDGE) items.push({x,y,d:x+y,cover:1});
  }
}
// ---- 小さなボート(横浜駅マップ): 運河をコの字に通る。電車の半分の頻度(電車は約55秒おき → ボートは約110秒おき)。行きと帰りで、向きを交互にする ----
const BOAT_SPEED = 1.3, BOAT_WAIT = 91;          // 速さ(マス/秒) / 次に通るまでの待ち時間(秒)
const BOAT = (MAPDEF.boat && !PREVIEW) ? (()=>{
  const p=MAPDEF.boat.path, seg=[]; let L=0;
  for(let i=0;i+1<p.length;i++){ const dx=p[i+1][0]-p[i][0], dy=p[i+1][1]-p[i][1], l=Math.hypot(dx,dy); seg.push({a:p[i],dx:dx/l,dy:dy/l,l,s0:L}); L+=l; }
  return {seg,L};
})() : null;
const boat = {s:0, dir:1, wait:20};
function boatAt(s){
  const sg=BOAT.seg; let g=sg[sg.length-1];
  for(const q of sg) if(s<=q.s0+q.l){ g=q; break; }
  const u=Math.min(Math.max(s-g.s0,0),g.l);
  let dx=g.dx, dy=g.dy;                                    // 曲がり角の前後0.5マスで、向きをなめらかに変える
  for(let i=1;i<sg.length;i++){ const c=sg[i].s0, w=Math.max(0,Math.min(1,(s-(c-.5))/1));
    if(w>0&&w<1){ dx=sg[i-1].dx*(1-w)+sg[i].dx*w; dy=sg[i-1].dy*(1-w)+sg[i].dy*w; const l=Math.hypot(dx,dy)||1; dx/=l; dy/=l; } }
  const fd=MAPDEF.boat.fade||0, a=fd?Math.max(0,Math.min(1,s/fd,(BOAT.L-s)/fd)):1;     // fade: 端から、この距離(マス)で、だんだん消える
  return {x:g.a[0]+g.dx*u, y:g.a[1]+g.dy*u, hx:dx*boat.dir, hy:dy*boat.dir, a};
}
function updateBoat(dt){
  if(!BOAT) return;
  if(boat.wait>0){ boat.wait-=dt; return; }
  boat.s += boat.dir*BOAT_SPEED*dt;
  if(boat.dir>0 && boat.s>=BOAT.L){ boat.s=BOAT.L; boat.dir=-1; boat.wait=BOAT_WAIT; }
  else if(boat.dir<0 && boat.s<=0){ boat.s=0; boat.dir=1; boat.wait=BOAT_WAIT; }
}
function boatItems(items){
  if(!BOAT || boat.wait>0) return;
  const b=boatAt(boat.s), sx=b.x-b.hx*.22, sy=b.y-b.hy*.22, bx=b.x+b.hx*.22, by=b.y+b.hy*.22;
  // 船尾か船首が橋・道のマスにあるときは、そのマスを描き直す(=橋の下をくぐる)より先に描く
  const d=Math.min(Math.floor(sx)+Math.floor(sy), Math.floor(bx)+Math.floor(by))-.5;
  items.push({x:b.x,y:b.y,d,boat:b});
  const seen=new Set();
  for(const g of BOAT.seg) for(let u=0;u<=g.l;u+=.25){
    const cx=Math.floor(g.a[0]+g.dx*u), cy=Math.floor(g.a[1]+g.dy*u), k=cy*N+cx;
    if(!inb(cx,cy)||seen.has(k)) continue; seen.add(k);
    if(terrain[cy][cx]!==WATER) items.push({x:cx,y:cy,d:cx+cy,cover:1});
  }
}
// 移動の経路を描く: 赤い線(曲がるのは1回まで) + 移動先に、上から見た形の矢印の頭(2本の線) + 移動先のセルに、黄色の四角。相手のセルまでは、線を引かない
function drawMovePath(path){
  if(!path || path.length<2) return;                              // 動かずに、隣と合体できるときは、線も印も、なし
  const n=path.length, [ex,ey]=path[n-1], [px,py]=path[n-2];
  poly(diamond(ex,ey,1.12),'rgba(255,224,0,.17)','rgba(255,224,0,.6)',5);   // 移動先の四角(移動元と同じ黄色の、濃さ60%)
  ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round'; ctx.strokeStyle='#ff0000'; ctx.lineWidth=5;
  ctx.beginPath(); path.forEach((c,i)=>{ const [cx,cy]=center(c[0],c[1]); i?ctx.lineTo(cx,cy):ctx.moveTo(cx,cy); }); ctx.stroke();
  // 矢印の頭: 地面を真上から見た向きで、「>」の形に2本の線を引く(タイル座標で描いて、盤面と同じ斜めの見え方に投影する)
  const ux=ex-px, uy=ey-py, vx=-uy, vy=ux, L=.34, W=.26, tx=ex+.5, ty=ey+.5;
  const P=(x,y)=>{ const [a,b]=proj(x,y); return [a,b]; };
  const tip=P(tx,ty), w1=P(tx-ux*L+vx*W,ty-uy*L+vy*W), w2=P(tx-ux*L-vx*W,ty-uy*L-vy*W);
  ctx.beginPath(); ctx.moveTo(w1[0],w1[1]); ctx.lineTo(tip[0],tip[1]); ctx.lineTo(w2[0],w2[1]); ctx.stroke();
  ctx.restore();
}
function drawBoat(b){
  ctx.save(); ctx.globalAlpha=b.a;
  const z0=SHIP_WATER_Z-2+Math.sin(performance.now()/700)*.8, H=3.5;
  const P=(x,y,z)=>{ const [a,c]=proj(x,y); return [a,c-z]; };
  const hx=b.hx, hy=b.hy, nx=-hy, ny=hx, Lh=.18, W=.077;
  const q=(l,w)=>[b.x+hx*l+nx*w, b.y+hy*l+ny*w];
  const hull=[q(-Lh,-W),q(-Lh,W),q(.04,W),q(Lh,0),q(.04,-W)];       // 船尾 → 右舷 → 船首 → 左舷
  let area=0; for(let i=0;i<hull.length;i++){ const A=hull[i], B=hull[(i+1)%hull.length]; area+=A[0]*B[1]-B[0]*A[1]; }
  const sg=area>0?1:-1;
  for(let i=0;i<hull.length;i++){                                    // 五角柱: 上の面と下の面は同じ形。外向きの法線が手前(+x, +y)を向く側面だけ描く
    const A=hull[i], B=hull[(i+1)%hull.length], ex=B[0]-A[0], ey=B[1]-A[1], nx2=ey*sg, ny2=-ex*sg;   // 外向きの法線
    if(nx2+ny2<=1e-9) continue;
    const f=.8+.2*Math.max(0,ny2)/(Math.abs(nx2)+Math.abs(ny2)+1e-9);
    poly([P(A[0],A[1],z0),P(B[0],B[1],z0),P(B[0],B[1],z0+H),P(A[0],A[1],z0+H)], shade('#ffffff',f));
  }
  poly(hull.map(h=>P(h[0],h[1],z0+H)), '#ffffff');                    // 甲板(真っ白)
  ctx.restore();
}
function drawRoadCover(x,y){
  const t=terrain[y][x];
  const im = t===BRIDGE ? ROAD_IMGS[wet(x-1,y)&&wet(x+1,y) ? 'NS' : 'EW'] : ROAD_IMGS[roadMask(x,y)];
  drawRoadTile(im,x,y);
}
function drawTrainCar(t){
  ctx.save();
  ctx.globalAlpha=t.a; ctx.translate(0,ELEV?-ELEV_Z1:CANAL_D);   // 線路は掘り下げてあるので電車も下げる(高架なら、持ち上げる)
  const P=(x,y,z)=>{const [px,py]=proj(x,y); return [px,py-z];};
  const xa = TRAIN_COL ? TRAIN_L-.14 : t.ac-.46, xb = TRAIN_COL ? TRAIN_L+.14 : t.ac+.46;
  const ya = TRAIN_COL ? t.ac-.46 : TRAIN_L-.14, yb = TRAIN_COL ? t.ac+.46 : TRAIN_L+.14;
  const TS=RSTYLE.train;
  boxC(xa,xb,ya,yb,0,12,TS.body,TS.roof);
  // 見える2面: 面A(y=yb, x方向に伸びる) / 面B(x=xb, y方向に伸びる)。長い側面に帯と窓を描く
  const faceA=(t0,t1,z0,z1,c)=>poly([P(t0,yb,z0),P(t1,yb,z0),P(t1,yb,z1),P(t0,yb,z1)], c);
  const faceB=(t0,t1,z0,z1,c)=>poly([P(xb,t0,z0),P(xb,t1,z0),P(xb,t1,z1),P(xb,t0,z1)], c);
  const long = TRAIN_COL ? faceB : faceA, end = TRAIN_COL ? faceA : faceB;
  const [l0,l1] = TRAIN_COL ? [ya,yb] : [xa,xb], [e0,e1] = TRAIN_COL ? [xa,xb] : [ya,yb];
  const cA=shade(TS.band,.92), cB=shade(TS.band,.78);                    // 帯の色(面A・面Bの明るさ)
  long(l0,l1,3.5,5.5,TRAIN_COL?cB:cA); end(e0,e1,3.5,5.5,TRAIN_COL?cA:cB);   // 帯
  for(let j=0;j<4;j++){                                                 // 窓
    const w0=l0+.07+j*.2, w1=w0+.14;
    long(w0,w1,7,10,'#22344a');
  }
  ctx.restore();
}

function frame(now){
  const dt=Math.min(.05,(now-(frame.last||now))/1000); frame.last=now;
  updateCars(dt); updateSites(now); updateTrain(dt); updateBoat(dt); updateAmbience(now);
  layout();
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*view.s,0,0,dpr*view.s,dpr*view.tx,dpr*view.ty);

  // 盤の厚み
  // 地面
  drawGround(now);

  const hv = preview || hover;      // タッチは preview、マウスは hover
  const hvDest = (sel && hv) ? resolveDest(hv) : null;      // ホバー中のセルが、相手の駒か、相手の隣の移動先なら、その行き先
  // 移動可能先ハイライト
  const pulse=.5+.5*Math.sin(now/200);
  if(sel){
    // 接続先の候補は、ホバーするまで反応させない(ホバー中の1マスだけ光らせる)
    if(hvDest) poly(diamond(hvDest.b[0],hvDest.b[1],1), `rgba(255,255,100,${.25+.25*pulse})`);
  }
  // 経路プレビュー
  let hoverPath=null;
  if(sel && hvDest){ hoverPath=hvDest.path; }

  // 駒
  const items=[], nums=[];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(grid[y][x]) items.push({x,y,d:x+y,v:grid[y][x],k:kind[y][x]});
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){ if(terrain[y][x]===STATION) items.push({x,y,d:x+y,st:1}); else if(terrain[y][x]===GSTN) items.push({x,y,d:x+y+.5,rwbox:1}); }
  if(mover) items.push({x:mover.x,y:mover.y,d:mover.x+mover.y+.4,v:mover.v,k:mover.k,mv:1});
  for(const g of MAPDEF.gates||[]){                                 // 門: 奥の柱 → (車) → 手前の柱・梁・屋根
    items.push({x:g.x,y:g.y,d:g.x+g.y+.65,gate:g,part:0}, {x:g.x,y:g.y,d:g.x+g.y+1.35,gate:g,part:1});
  }
  gondolaItems(items,now);
  for(const k in LMK){ const lx=k%N, ly=k/N|0; items.push({x:lx,y:ly,d:lx+ly+.5,lmk:LMK[k]}); }          // ランドマーク
  for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(terrain[y][x]===ARC) items.push({x,y,d:x+y+.5,arc:1});     // アーケード
  for(const g of noEntrySigns()) items.push({x:g.x,y:g.y,d:g.x+g.y+.45,sign:g});          // 車両進入禁止の立札
  for(const k of VDK){ const vx=k%N, vy=k/N|0; items.push({x:vx,y:vy,d:vx+vy+.5,via:1,pier:terrain[vy][vx]!==ROAD,wide:terrain[vy][vx]===VSTN||VSX.has(k)}); }   // 高架の線路
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){ if(terrain[y][x]===VSTN || VSX.has(y*N+x)){ items.push({x,y,d:x+y+.55,ostnb:1}); items.push({x,y,d:x+y+.7,ostn:1}); } else if(terrain[y][x]===HKST) items.push({x,y,d:x+y+.5,hk:1}); }
  for(const k of DECK){ const dx=k%N, dy=k/N|0; items.push({x:dx,y:dy,d:dx+dy+.5,deck:1,under:terrain[dy][dx]===ROAD||terrain[dy][dx]===BRIDGE}); }   // 高速道路
  for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(terrain[y][x]===MTOWER) items.push({x,y,d:x+y+.5,mtower:1});
  for(const st of sites.values()) items.push({x:st.x,y:st.y,d:st.x+st.y,site:st});
  for(const key of fresh){                                        // 工事が終わったばかりの建物: 奥の柵→建物→手前の柵
    const fx=key%N, fy=key/N|0;
    if(!grid[fy][fx]){ fresh.delete(key); continue; }
    items.push({x:fx,y:fy,d:fx+fy-.001,fence:0}, {x:fx,y:fy,d:fx+fy+.001,fence:1});
  }
  for(const c of cars){
    const px=c.gx+(c.tx-c.gx)*c.t+c.ox, py=c.gy+(c.ty-c.gy)*c.t+c.oy;
    items.push({x:px,y:py,d:px+py+.3,car:c});
  }
  for(let i=ghosts.length-1;i>=0;i--){ const g=ghosts[i]; if(now-g.t>GHOST_WARN+GHOST_OUT) ghosts.splice(i,1); else items.push({x:g.x,y:g.y,d:g.x+g.y,ghost:g}); }
  trainItems(items); trainCoverItems(items); boatItems(items);
  items.sort((a,b)=>a.d-b.d||a.x-b.x);
  for(const it of items){
    if(it.st){ drawStationCell(it.x,it.y); continue; }
    if(it.rwbox){ drawRopewayBox(it.x,it.y); continue; }
    if(it.car){ drawCar(it.car); continue; }
    if(it.tr){ drawTrainCar(it.tr); continue; }
    if(it.boat){ drawBoat(it.boat); continue; }
    if(it.ghost){ drawGhost(it.ghost,now); const g=it.ghost; if(now-g.t>=0 && now-g.t<GHOST_WARN){ const [gx,gy]=center(g.x,g.y); nums.push([g.v,g.k,gx,gy-NUM_H,g.x,g.y]); } continue; }
    if(it.cover){ drawRoadCover(it.x,it.y); continue; }
    if(it.site){ drawSite(it.site,now); continue; }
    if(it.fence!=null){ drawFence(it.x,it.y,it.fence); continue; }
    if(it.gate){ drawGate(it.gate,it.part); continue; }
    if(it.mtower){ drawMarineTower(it.x,it.y); continue; }
    if(it.lmk){ ({K:drawKaiyukan,Z:drawTempozan,L:drawGlico,E:(a,b)=>drawEbisu(a,b,now),Y:drawUmedaSky,Q:(a,b)=>drawHepFive(a,b,now),J:drawTsutenkaku,F:(a,b)=>drawFerris(a,b,now)})[it.lmk](it.x,it.y); continue; }
    if(it.arc){ drawArcade(it.x,it.y); continue; }
    if(it.sign){ drawNoEntry(it.sign); continue; }
    if(it.via){ drawViaduct(it.x,it.y,it.pier,it.wide); continue; }
    if(it.ostnb){ drawOsakaStnBack(it.x,it.y); continue; }
    if(it.ostn){ drawOsakaStn(it.x,it.y); continue; }
    if(it.hk){ drawHankyuStn(it.x,it.y); continue; }
    if(it.deck){ drawDeck(it.x,it.y,it.under); continue; }
    if(it.gd){ it.gd(); continue; }
    let h=heightOf(it.v), lift=0, selected=false, glow=0;
    if(it.mv){
      lift=7;                                           // 移動中は少し浮かせて、真下に疑似ドロップシャドウ(50%)
      const [sx,sy]=center(it.x,it.y);
      ctx.save(); ctx.fillStyle='rgba(0,0,0,.5)'; ctx.beginPath(); ctx.ellipse(sx,sy,TW*.34,TH*.34,0,0,Math.PI*2); ctx.fill(); ctx.restore();
    }
    else {
      const key=it.y*N+it.x, an=anims.get(key);
      if(an){
        const t=(now-an.t)/(an.type==='spawn'?350:700);
        if(t<0) continue;
        if(t>=1) anims.delete(key);
        else if(an.type==='spawn') h*=Math.max(.01,ease(t));
        else { lift=Math.sin(Math.min(1,t*700/420)*Math.PI)*14; glow=Math.pow(1-t,1.6); }
      }
      if(sel && sel[0]===it.x && sel[1]===it.y){ lift+=6+2*Math.sin(now/150); selected=true; }
      else if(hv && hv[0]===it.x && hv[1]===it.y && !mover && !preview) lift+=3;
    }
    glowAmt=glow; drawBlock(it.x,it.y,it.v,it.k,h,lift,selected); glowAmt=0;
    const [ncx,ncy]=center(it.x,it.y);
    if(h/heightOf(it.v)>.6) nums.push([it.v,it.k,ncx,ncy-NUM_H,it.x,it.y]);
  }
  let hintInv=null;
  if(hintMode && hintPairs){                            // ヒント: 合体できるすべての組み合わせ以外は、画面を暗くして、関係する駒だけ描き直す
    ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='rgba(0,0,0,.62)'; ctx.fillRect(0,0,cv.width,cv.height); ctx.restore();
    hintInv=new Set(); for(const q of hintPairs){ hintInv.add(q.a[1]*N+q.a[0]); hintInv.add(q.b[1]*N+q.b[0]); }
    for(const key of hintInv){
      const x=key%N, y=key/N|0, v=grid[y][x], k=kind[y][x]; if(!v) continue;
      drawBlock(x,y,v,k,heightOf(v),0,false);
    }
    for(const q of hintPairs) poly(diamond(q.b[0],q.b[1],1.12), null, '#ff8a1f', 5);        // 相手(ターゲット)は、オレンジの枠
    for(const q of hintPairs) poly(diamond(q.a[0],q.a[1],1.12), null, '#ffe000', 5);        // 動かす駒は、黄色の枠
    for(const q of hintPairs) drawMovePath(q.path);                                         // すべての経路を、同じ書き方(赤い線 + 矢印 + 青い移動先)で
  }
  if(sel){                                              // 選んだ駒(黄色)と、相手(オレンジ)のセル: 枠を、セルより少し大きいひし形・接続線と同じくらいの太さで、建物の上・数字の下に描く
    poly(diamond(sel[0],sel[1],1.12), null, '#ffe000', 5);
    if(hvDest) poly(diamond(hvDest.b[0],hvDest.b[1],1.12), null, '#ff8a1f', 5);          // 相手(ターゲット)は、オレンジ
  }

  if(showInfo) for(const n of nums){

    drawNum(n[0],n[1],n[2],n[3]);
  }
  drawLabels();
  drawFreshSparkles(now);                                        // 工事直後(柵が残っている間)の建物: 十字のきらめき
  // エフェクト
  effects=effects.filter(e=>now-e.t<(e.type==='dust'?e.life:e.type==='pillar'?1400:e.type==='confetti'?3200:e.type==='lvburst'?2000:900));
  for(const e of effects){
    if(e.type==='dust'){
      const t=(now-e.t)/e.life; if(t<0) continue;
      const u=1-Math.pow(1-t,2);          // 最初は勢いよく、だんだんゆっくり
      const x=e.cx+e.vx*u, y=e.cy+e.vy*u-e.rise*u, rad=e.r*(.85+.35*t), al=(1-t)*.25;
      ctx.save(); ctx.globalAlpha=al;
      ctx.fillStyle='#9b7a55';                              // 茶色のべた塗り(立体感なし)
      ctx.beginPath(); ctx.ellipse(x,y,rad,rad*.6,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
      continue;
    }
    if(e.type==='confetti'){
      // 反射する紙吹雪: 薄く、ひらひら回転しながらきらっと光ってゆっくり落ちる
      const D=2700, tt=(now-e.t)/D; if(tt<0) continue;
      const [cx,cy]=center(e.x,e.y), s=Math.min(1,(e.lv-1)/2), seed=e.x*17+e.y*5, n=Math.round(10+s*34);
      const hr=(i)=>{ const v=Math.sin(i*127.1+seed*311.7)*43758.5453; return v-Math.floor(v); };
      ctx.save();
      for(let i=0;i<n;i++){
        const p=Math.min(1,tt/(.55+hr(i+7)*.45)); if(p>=1) continue;
        const v0=50+hr(i+11)*(60+s*90), spread=(18+s*38)*(.3+hr(i+13)*.7)*(hr(i+17)<.5?-1:1);
        const x=cx+spread*Math.sqrt(p)+Math.sin(p*7+i)*5, y=cy-14-v0*p+v0*1.35*p*p;
        const flip=now/(110+hr(i+19)*140)+i, glint=Math.max(0,Math.sin(flip*1.7));
        ctx.globalAlpha=Math.min(1,p*8)*(1-p)*(.3+.3*glint);
        ctx.fillStyle=`hsl(${44+hr(i+23)*12},${Math.round(s*(70+hr(i+29)*30))}%,${Math.round(72+glint*28)}%)`;
        ctx.save(); ctx.translate(x,y); ctx.rotate(flip*.8);
        const w=2.5+hr(i+31)*2.5; ctx.fillRect(-w,-1.6*Math.abs(Math.cos(flip)),w*2,3.2*Math.abs(Math.cos(flip))+.4);
        ctx.restore();
      }
      ctx.restore();
      continue;
    }
    if(e.type==='lvburst'){
      // レベルアップ: 建物から金色のひし形の波紋が何重にも広がり、放射状の光が走る
      const t=(now-e.t)/1900, [cx,cy]=center(e.x,e.y), hw=TW/2, hh=TH/2;
      ctx.save(); ctx.globalCompositeOperation='lighter';
      for(let r=0;r<4;r++){
        const rt=Math.min(1,Math.max(0,t*1.25-r*.16)); if(rt<=0||rt>=1) continue;
        const k=.6+rt*5.5, a=Math.pow(1-rt,1.4);
        ctx.lineWidth=(4-r*.7); ctx.strokeStyle=`rgba(255,${215-r*25},${100+r*20},${a})`;
        ctx.beginPath(); ctx.moveTo(cx,cy-hh*k); ctx.lineTo(cx+hw*k,cy); ctx.lineTo(cx,cy+hh*k); ctx.lineTo(cx-hw*k,cy); ctx.closePath(); ctx.stroke();
      }
      const rt=Math.min(1,t*1.4);                      // 放射状の光

        const ang=i/20*Math.PI*2+t*.8, r0=24+rt*40, r1=r0+30+rt*120*(i%2?.7:1), a=(1-rt)*.9;
        ctx.strokeStyle=`rgba(255,${230-(i%3)*30},150,${a})`; ctx.lineWidth=2+(i%3);
        ctx.beginPath(); ctx.moveTo(cx+Math.cos(ang)*r0,cy-26+Math.sin(ang)*r0*.6); ctx.lineTo(cx+Math.cos(ang)*r1,cy-26+Math.sin(ang)*r1*.6); ctx.stroke();
      }
      const g=ctx.createRadialGradient(cx,cy-20,0,cx,cy-20,90*(.4+t));                // 中心のきらめき
      g.addColorStop(0,`rgba(255,250,210,${.8*(1-t)})`); g.addColorStop(1,'rgba(255,220,120,0)');
      ctx.fillStyle=g; ctx.fillRect(cx-160,cy-170,320,300);
      ctx.restore();
      continue;
    }
    if(e.type==='pillar'){
      // 光の柱: 低レベルは控えめな白、レベルが上がるほど強く金色に
      const D=1400, t=(now-e.t)/D, [cx,cy]=center(e.x,e.y), hw=TW/2, hh=TH/2;
      const s=Math.min(1,(e.lv-1)/2), seed=e.x*13+e.y*7;
      const rise=Math.min(1,t*4), H=(28+s*222)*(1-Math.pow(1-rise,3)), a=t<.25?1:Math.max(0,1-(t-.25)/.75);
      const pw=.55+s*.45, col=(al,w=0)=>`rgba(255,${Math.round(255-s*(55-w*40))},${Math.round(255-s*(190-w*150))},${al})`;
      const hr=(i)=>{ const v=Math.sin(i*127.1+seed*311.7)*43758.5453; return v-Math.floor(v); };
      ctx.save(); ctx.globalCompositeOperation='lighter';
      // 柱本体(ひし形の押し出し)
      const g=ctx.createLinearGradient(0,cy,0,cy-H);
      g.addColorStop(0,col(.9*a*pw)); g.addColorStop(.6,col(.45*a*pw,.5)); g.addColorStop(1,col(0));
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.moveTo(cx-hw,cy); ctx.lineTo(cx,cy+hh); ctx.lineTo(cx+hw,cy); ctx.lineTo(cx+hw,cy-H); ctx.lineTo(cx,cy-hh-H); ctx.lineTo(cx-hw,cy-H); ctx.closePath(); ctx.fill();
      // 縦の光条(ちらつく)
      const nb=4+e.lv*2;
      for(let i=0;i<nb;i++){
        const bx=cx+(hr(i)*2-1)*hw*.85, bw=2+hr(i+50)*(4+s*4), bh=H*(.6+hr(i+90)*.6), fl=.85;
        const lg=ctx.createLinearGradient(0,cy,0,cy-bh); lg.addColorStop(0,col(.95*a*fl,1)); lg.addColorStop(1,col(0));
        ctx.fillStyle=lg; ctx.fillRect(bx-bw/2,cy-bh,bw,bh);
      }
      // 中心の明るい芯
      const cg=ctx.createLinearGradient(0,cy,0,cy-H*.9); cg.addColorStop(0,`rgba(255,255,255,${.9*a})`); cg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=cg; ctx.fillRect(cx-hw*.18,cy-H*.9,hw*.36,H*.9);
      // 光の粒: 小さな四角が直線的にほんの少しだけ上へ動く(揺れなし)
      const np=10+e.lv*8;
      for(let i=0;i<np;i++){
        const pt=(t*.5+hr(i+200)*.5)%1, sz=1+hr(i+500)*(1+s), px=cx+(hr(i+300)*2-1)*hw*.9, py=cy-hr(i+400)*H*.85-pt*10;
        ctx.fillStyle=col(Math.min(1,(1-pt)*1.6)*a,1); ctx.fillRect(Math.round(px-sz/2),Math.round(py-sz/2),sz,sz);
      }
      ctx.restore();
      // 地面に広がるひし形の波紋: グロー・グラデ・加算合成なしの、ただの1pxワイヤーフレーム(広がりながら薄くなる)
      ctx.save(); ctx.lineWidth=1/view.s; ctx.strokeStyle=col(1,1);
      for(let r=0;r<2;r++){
        const rt=Math.min(1,Math.max(0,t*1.15-r*.15)); if(rt<=0||rt>=1) continue;
        ctx.globalAlpha=Math.max(0,1-rt*2)*.5;                 // 半分の時間で消え、濃さも半分
        if(ctx.globalAlpha<=0) continue;
        poly(diamond(e.x,e.y,1+rt*(1.6+s*1.6)),null,col(1,1),1/view.s);
      }
      ctx.restore();
      continue;
    }
    const t=(now-e.t)/900, [cx,cy]=center(e.x,e.y);
    ctx.font='bold 20px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=`rgba(255,255,255,${1-t})`; ctx.strokeStyle=`rgba(0,0,0,${.6*(1-t)})`; ctx.lineWidth=3;
    ctx.strokeText(e.txt,cx,cy-heightOf(8)-20-t*30); ctx.fillText(e.txt,cx,cy-heightOf(8)-20-t*30);
  }
  if(over && !PREVIEW) drawCelebration(now); else if(FW.on) resetCelebration();      // クリア後: 花火と光の粒
  // 移動アニメ更新
  if(mover){
    const t=Math.min(1,(now-mover.t0)/mover.dur), steps=mover.path.length-1;
    const f=t*steps, i=Math.min(steps-1,f|0), u=f-i;
    const p=mover.path[i], q=mover.path[i+1];
    mover.x=p[0]+(q[0]-p[0])*u; mover.y=p[1]+(q[1]-p[1])*u;
    if(now-(mover.dustT||0)>22){                        // 移動中は後ろへ土煙
      mover.dustT=now; const [dcx,dcy]=center(mover.x,mover.y), ang=Math.atan2(q[1]-p[1],q[0]-p[0]);
      puff(dcx,dcy,3,{back:ang,sp:10,rise:3,r:14});
    }
    if(t>=1) finishMove();
  }
  if(PREVIEW){                                       // 建物の画像が読み込まれたあと、数フレーム描いたら止める
    frame.n=(frame.n||0)+1;
    const imgs=Object.values(ICON_IMGS).flat(), ready=imgs.every(im=>im.complete) && Object.values(ROAD_IMGS).every(im=>im.complete);
    if(ready && frame.n>40) return;
