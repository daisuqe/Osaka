}

// ---- クリア演出: 大きな花火と、街じゅうに漂う光の粒 ----
const FW={on:false, rockets:[], sparks:[], flashes:[], next:0, last:0, motes:null};
function sfxBoom(){                                         // 遠くで、ドン…パチパチ
  if(!AC||!soundOn) return;
  const t=AC.currentTime, n=noiseSrc(), f=AC.createBiquadFilter(), g=AC.createGain();
  f.type='lowpass'; f.frequency.value=480; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.5,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+1);
  n.connect(f); f.connect(g); g.connect(master); if(reverb) g.connect(reverb); n.stop(t+1.1);
  tone(62,t,.55,'sine',.28);
  for(let i=0;i<7;i++) tone(1800+Math.random()*3200,t+.3+i*.05+Math.random()*.04,.03,'square',.006);
}
let fwSeq=0;                                               // 何発目か(形と色は、順番に決める。ランダムではなく幾何学的に)
function fwShape(kind){                                    // 形: 中心を0・半径を1とした、点の位置(x,y)と色番号の並び
  const P=[], TAU=Math.PI*2, poly=(n,r,rot,c,per)=>{ for(let i=0;i<n;i++){ const a0=rot+i/n*TAU, a1=rot+(i+1)/n*TAU;
    for(let j=0;j<per;j++){ const u=j/per, x=Math.cos(a0)*(1-u)+Math.cos(a1)*u, y=Math.sin(a0)*(1-u)+Math.sin(a1)*u; P.push([x*r,y*r,c]); } } };
  if(kind==='rings'){ for(const [r,n,c] of [[.38,12,0],[.68,20,1],[1,28,0]]) for(let i=0;i<n;i++){ const a=i/n*TAU; P.push([Math.cos(a)*r,Math.sin(a)*r,c]); } }   // 同心円
  else if(kind==='round'){ for(const [r,n] of [[.25,6],[.5,12],[.75,18],[1,24]]) for(let i=0;i<n;i++){ const a=i/n*TAU+r; P.push([Math.cos(a)*r,Math.sin(a)*r,0]); } }   // まんまるの菊
  else { for(let i=0;i<30;i++){ const a=i/30*TAU; P.push([Math.cos(a),Math.sin(a),0]); } }                                                                 // ひとつの輪
  return P;
}
const FW_SHAPES=['round','rings','ring'], FW_COLS=[[355,0],[44,34],[190,320],[130,44],[320,190],[20,130]];   // 形ごとの、色(内側・外側など)の色相
function fwBurst(cx,cy,R){
  const kind=FW_SHAPES[fwSeq%FW_SHAPES.length], cols=FW_COLS[fwSeq%FW_COLS.length]; fwSeq++;
  const k=1.5, rot=fwSeq*.35;
  for(const [x,y,c] of fwShape(kind)){
    const cs=Math.cos(rot), sn=Math.sin(rot), px=x*cs-y*sn, py=x*sn+y*cs;                // 形ごとに、少しずつ回して開く
    FW.sparks.push({x:cx,y:cy,px:cx,py:cy,vx:px*R*k,vy:py*R*k,age:0,life:2.4,h:cols[c%2],l:62,k,g:R*.25,sd:Math.random()*9});     // 同じ速さの割合で広がるので、形が崩れずに大きくなる
  }
  FW.flashes.push({x:cx,y:cy,t:0,R:R*.6});
  sfxBoom();
}
function drawCelebration(now){
  const W=innerWidth, H=innerHeight;
  const dt=Math.min(.05, FW.last?(now-FW.last)/1000:.016); FW.last=now;
  if(!FW.on){ FW.on=true; FW.next=.25; }
  // 街じゅうの光の粒(ワールド座標。盤面の上をゆっくり昇りながら瞬く)
  if(!FW.motes) FW.motes=Array.from({length:Math.round(N*N*.35)},()=>({u:Math.random()*N,v:Math.random()*N,z:6+Math.random()*110,ph:Math.random()*6.28,f:(1.6+Math.random()*3.4)*.81,s:.6+Math.random()*.8,cy:null,
    c:Math.random()*4|0}));
  if(!FW.glow) FW.glow=['255,232,160','255,255,255','150,232,255','255,190,232'].map(c=>{        // 光の粒のグロー(にじむ光の画像を、色ごとに1枚作っておく)
    const g=document.createElement('canvas'); g.width=g.height=64; const x=g.getContext('2d');       // 正方形の光: 小さい四角を重ねて、四角いにじみにする
    for(let h=32;h>=4;h-=4){ x.fillStyle=`rgba(${c},${.05+.5*Math.pow(1-h/32,2)})`; x.fillRect(32-h,32-h,h*2,h*2); }
    x.fillStyle=`rgba(${c},1)`; x.fillRect(26,26,12,12); return g; });
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(const m of FW.motes){                                   // その場で瞬くだけ(上には昇らない)。瞬くたびに、場所を変える
    const ph=now/1000*m.f+m.ph, tw=.5+.5*Math.sin(ph), cy=Math.floor((ph+Math.PI/2)/6.2832);
    if(cy!==m.cy){ m.cy=cy; m.u=Math.random()*N; m.v=Math.random()*N; m.z=6+Math.random()*110; }
    if(tw<.04) continue;
    const [px,py]=proj(m.u,m.v), r=m.s*(.5+.6*tw)*5;
    ctx.globalAlpha=tw; ctx.drawImage(FW.glow[m.c],px-r,py-m.z-r,r*2,r*2);
  }
  ctx.globalAlpha=1;
  // 花火(画面座標)
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const fdt=dt*.7;                                            // 花火の動きは、3割ゆっくり
  FW.next-=dt;
  if(FW.next<=0){                                             // 一定の間隔で、左→右→中央…の順に1発ずつ(以前の半分の頻度)
    const base=Math.min(W,H*1.15), X=[.3,.7,.5][fwSeq%3], ty=H*.27;
    FW.rockets.push({x:W*X,y:H+10,ty,vy:-(H-ty)/1.0,R:base*.36,t:0});
    FW.next=2.7;
  }
  for(let i=FW.rockets.length-1;i>=0;i--){
    const r=FW.rockets[i]; r.t+=fdt; if(r.t<0) continue;
    r.y+=r.vy*fdt;
    if(FW.sparks.length<1800 && Math.random()<.35) FW.sparks.push({x:r.x+(Math.random()-.5)*3,y:r.y,px:r.x,py:r.y,vx:(Math.random()-.5)*30,vy:20+Math.random()*30,age:0,life:.5,h:42,l:70,k:1,g:60,sd:Math.random()*9});   // 昇る尾
    ctx.fillStyle='rgba(255,236,170,.95)'; ctx.fillRect(Math.round(r.x)-2,Math.round(r.y),5,5);
    if(r.y<=r.ty){ fwBurst(r.x,r.y,r.R); FW.rockets.splice(i,1); }
  }
  for(let i=FW.flashes.length-1;i>=0;i--){                      // 開いた瞬間の白い閃光
    const f=FW.flashes[i]; f.t+=fdt; const u=f.t/.35; if(u>=1){ FW.flashes.splice(i,1); continue; }
    const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.R*(.3+u*.5)); g.addColorStop(0,`rgba(255,250,225,${.75*(1-u)})`); g.addColorStop(1,'rgba(255,230,160,0)');
    ctx.fillStyle=g; ctx.fillRect(f.x-f.R,f.y-f.R,f.R*2,f.R*2);
  }
  for(let i=FW.sparks.length-1;i>=0;i--){
    const p=FW.sparks[i]; p.age+=fdt; const u=p.age/p.life; if(u>=1){ FW.sparks.splice(i,1); continue; }
    p.px=p.x; p.py=p.y;
    const d=Math.exp(-p.k*fdt); p.vx*=d; p.vy=p.vy*d+p.g*fdt; p.x+=p.vx*fdt; p.y+=p.vy*fdt;
    let a=Math.pow(1-u,1.3); if(u>.55) a*=.55+.45*Math.sin(p.age*38+p.sd);       // 消える前にチカチカ
    ctx.fillStyle=`hsla(${p.h},100%,${p.l+(u<.12?25:0)}%,${a})`;                       // 小さな四角のドット
    const q=Math.max(7,Math.round(Math.min(W,H)/72)); ctx.fillRect(Math.round(p.x/q)*q,Math.round(p.y/q)*q,q,q);
  }
  ctx.restore();
  ctx.setTransform(dpr*view.s,0,0,dpr*view.s,dpr*view.tx,dpr*view.ty);
}
function resetCelebration(){ FW.on=false; FW.rockets.length=0; FW.sparks.length=0; FW.flashes.length=0; FW.last=0; }

// ================= 効果音 (WebAudioで合成。素材ファイルなし) =================
let AC=null, master=null, reverb=null, soundOn=true, musicOn=true, noiseBuf=null, clackT=0;
// 音量: 効果音(SFX)と音楽(Music)を、別々に 0〜100% で。はじまりは、どちらも 50%(今までの音の大きさ)。0 でオフ。前回の設定は覚えておく
let sfxVol=.5, musicVol=.5;
try{ const v=JSON.parse(localStorage.getItem('osaka-vol')||'null'); if(v){ if(typeof v.sfx==='number') sfxVol=Math.max(0,Math.min(1,v.sfx)); if(typeof v.music==='number') musicVol=Math.max(0,Math.min(1,v.music)); } }catch(_){}
soundOn = sfxVol>0; musicOn = musicVol>0;
function audioInit(){
  if(AC) { if(AC.state==='suspended') AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){ return; }
  master=AC.createGain(); master.gain.value=sfxVol*2; master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  { const len=AC.sampleRate*1.6, ir=AC.createBuffer(2,len,AC.sampleRate);          // 遠くで響く残響(減衰するノイズ)
    for(let c=0;c<2;c++){ const ch=ir.getChannelData(c); for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5); }
    const cv=AC.createConvolver(), lp=AC.createBiquadFilter(), wg=AC.createGain();
    cv.buffer=ir; lp.type='lowpass'; lp.frequency.value=1800; wg.gain.value=.3;
    reverb=AC.createGain(); reverb.connect(cv); cv.connect(lp); lp.connect(wg); wg.connect(master); }
  if(typeof bgmStart==='function') bgmStart();
}
function noiseSrc(){ const n=AC.createBufferSource(); n.buffer=noiseBuf; n.loop=true; n.start(0,Math.random()); return n; }
function tone(freq,t0,dur,type,vol,dest){
  const o=AC.createOscillator(), g=AC.createGain();

  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.008); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(dest||master); o.start(t0); o.stop(t0+dur+.05);
}
// 引きずる音: 低くて小さい「ゴゴゴ」という地鳴り (太鼓のような打撃音はなし)
function sfxDrag(dur){

function sfxMerge(tier){
  if(!AC||!soundOn) return;
  const t=AC.currentTime, base=880*Math.pow(2,Math.min(tier,8)/24), notes=[1,1.25,1.5,2,2.5];
  const cnt=Math.min(5,3+(tier>3?1:0)+(tier>6?1:0));
  for(let i=0;i<cnt;i++){
    const f=base*notes[i], at=t+i*.055;
    tone(f,at,.55,'sine',.16); tone(f*2.01,at,.3,'triangle',.05);
  }

  const rich=Math.min(1,.3+tier/8);
  tone(base/2,t,.6,'sine',.008*rich);

  const pent=[1,9/8,5/4,3/2,5/3], n=5+Math.round(rich*8);

    case 'shaku': bgmShaku(at,p,MIDI_VOL.shaku*vel/.6,dur); break;
    case 'marimba': bgmMarimba(at,p,MIDI_VOL.marimba*vel/.5); break;
    case 'celesta': bgmCelesta(at,p,MIDI_VOL.celesta*vel/.4); break;
    case 'shami': bgmShami(at,p,MIDI_VOL.shami*vel/.45); break;
    case 'ep': case 'hep': bgmEP(at,p,MIDI_VOL[tr]*vel/.75,Math.min(1.6,dur*1.3+.15)); break;
    case 'mel': bgmEP(at,p,MIDI_VOL.mel*vel/.5,Math.min(1.8,dur*1.4+.25)); break;
    case 'bass': bgmBass(at,p,Math.max(.1,dur*.95),MIDI_VOL.bass*vel/.9); break;

      else if(p===37) bgmSnare(at,.02*vel/.6);
      else if(p===70) bgmHatTick(at,.008*vel/.5);
      else if(p===76) bgmWood(at,1250,.05*vel/.6);

function bgmTickMidi(){                                             // 先読みして、MIDI のノートを順に鳴らす(終わったら頭に戻ってくり返す)
  if(!AC||!BGM_ON) return;
  if(!musicOn){ MID.start=null; return; }                              // 音楽を切っている間は、止める(再開は、頭から)
  if(AC.state!=='running') return;                                     // 一時停止の間は、何もしない(再開したら、続きから)

function ptInPoly(px,py,pts){
  let c=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const [xi,yi]=pts[i],[xj,yj]=pts[j];
    if((yi>py)!==(yj>py) && px<(xj-xi)*(py-yi)/(yj-yi)+xi) c=!c;
  }

}
function pick(ev){
  const r=cv.getBoundingClientRect();
  const wx=(ev.clientX-r.left-view.tx)/view.s, wy=(ev.clientY-r.top-view.ty)/view.s;
  // 判定は地面の高さのひし形だけ。建物が上に伸びていても、その絵の上にカーソルがあるかは関係しない

}
function zoomAt(cx,cy,f){

const dist2 = (a,b) => (a[0]-b[0])*(a[0]-b[0]) + (a[1]-b[1])*(a[1]-b[1]);

function nearbyPiece(c,w){
  let best=null, bd=Infinity;
  for(const [dx,dy] of N8){
    const x=c[0]+dx, y=c[1]+dy; if(!inb(x,y) || !grid[y][x]) continue;
    const d=dist2(w,pieceCenter(x,y)); if(d<bd){ bd=d; best=[x,y]; }
  }
  return best;
}
// 2回目・3回目: 押した所が、行き先でなければ、周囲8マスの中で、行き先になるもの(相手の駒 / 相手の隣の移動先)を探す。複数あれば、相手の駒の位置が、押した座標に近いもの

function nearbyTarget(c,w){
  let best=null, bd=Infinity;
  for(const [dx,dy] of N8){
    const x=c[0]+dx, y=c[1]+dy; if(!inb(x,y)) continue;
    const d=resolveDest([x,y]); if(!d) continue;
    const dd=dist2(w,pieceCenter(d.b[0],d.b[1])); if(dd<bd){ bd=dd; best={b:d.b, path:d.path, cell:[x,y]}; }

  if(!sel){                                          // 1回目: 駒を選ぶ
    let p = grid[c[1]][c[0]] ? c : (tol ? nearbyPiece(c,w) : null);
    if(!p) return;
    if(grid[p[1]][p[0]]>=(KINDS[kind[p[1]][p[0]]].max||Infinity)){ sfxError(); setMsg(tr('maxLevel',grid[p[1]][p[0]])); return; }   // 最大レベル(1024)の建物は、選べない
    sel=[p[0],p[1]]; targets=targetsOf(p[0],p[1]); preview=null; previewB=null;      // 接続先がなくても選択はできる
    if(!targets.size) setMsg(tr('noPartner'));

  }
  if(sel[0]===c[0] && sel[1]===c[1]){ deselect(); return; }   // 選択中の駒をもう一度 = キャンセル

    hud(); setMsg(tr('hint',pairs.length,HINT_SITES));
  };
  if(freeCount(grid,[...sites.values()])<HINT_SITES) askGameOver('Hint',doHint); else doHint();
};
$('hintOk').onclick = () => { hintMode=false; hintPairs=null; sel=null; targets=new Map(); preview=null; hud(); setMsg(''); };


$('mapTitle').textContent = MAPDEF.title;
function placeTitle(){ $('mapTitle').style.top = ($('hud').offsetHeight+6)+'px'; }
addEventListener('resize', placeTitle); placeTitle();
if(PREVIEW) previewInit(); else if(!loadGame()) newGame();
if(DEV && new URLSearchParams(location.search).get('demo')==='clear'){        // 確認用: 数字 1・2・4・8 の建物がいっぱいの盤面で、64 → 128 → 256 を作って、祝福と消える演出をくり返す
  let demoN=0;                                                              // 64 → 128 → 256 の順に、くり返す
  const demo=()=>{
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){ grid[y][x]=0; }
    sites.clear(); ghosts.length=0; mover=null; over=false; boardFull=false; hintMode=false;
    const cells=[]; for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(terrain[y][x]===LAND) cells.push([x,y]);
    shuffle(cells);
    cells.forEach(([x,y],i)=>{ if(i<cells.length-4){ grid[y][x]=[1,2,4,8][i%4]; kind[y][x]=i%3; } });
    const [bx,by]=cells[cells.length-1]; const HOLD=new URLSearchParams(location.search).has('hold'), DV=HOLD?128:[64,128,256][demoN++%3]; grid[by][bx]=DV; kind[by][bx]=0; bestValue=Math.max(bestValue,DV);
    hud(); setTimeout(()=>{ clearLow(DV,[bx,by]); hud();
      if(HOLD) setInterval(()=>{ for(const g of ghosts) g.t=performance.now()-700; const el=$('clearToast'); if(!el.classList.contains('held')){ el.classList.add('held'); } el.style.display='block'; el.style.animation='none'; el.style.opacity=1; if(Math.random()<.04) effects.push({type:'pillar', x:bx, y:by, t:performance.now(), lv:3, tint:KINDS[0].tint}); },30);     // ?hold=1: 光って、お知らせが出た、その瞬間を、止めて見せる(キャプチャ用)
    },800);
  };
  demo(); if(!new URLSearchParams(location.search).has('hold')) setInterval(demo,7000);
}
initCars(PREVIEW ? 0 : CAR_COUNT);              // タイトル画面のプレビューは止まった絵なので、車は出さない(走って途中で止まって見えるため)
requestAnimationFrame(frame);
</script>
</body>
